<style>

    background:#fff; border-color:#d7e2ef; border-left-color:#315c91;
    box-shadow:0 3px 10px rgba(19,48,86,.055);
  }
  body.exchange-page .txn.risk { border-left-color:#c43b49; }
  body.exchange-page .txn-h { border-bottom-color:#e1e9f3; background:#f8fbff; }
  body.exchange-page .txn-h .no { color:#18365f; }
  body.exchange-page .txn-f .k,
  body.exchange-page .txn-trio .k { color:#667e9c; }
  body.exchange-page .txn-f .v,
  body.exchange-page .txn-trio .v { color:#18365f; }

  body.exchange-page .txn-a { border-top-color:#e0e8f2; }
  body.exchange-page .btn {
    color:#1d3c64; background:#fff; border-color:#c8d7e9;
    box-shadow:0 1px 2px rgba(16,42,79,.035);
  }
  body.exchange-page .btn:hover { background:#f3f7fc; border-color:#a8bed9; }
  body.exchange-page .btn.primary {
    color:#fff; background:linear-gradient(135deg,#244879,#10294e);
    border-color:#18365f; box-shadow:0 2px 6px rgba(16,42,79,.16);
  }
  body.exchange-page .btn.primary:hover {
    background:linear-gradient(135deg,#1a3b68,#0b2142); border-color:#10294e;
  }
  body.exchange-page .btn.approve,
  body.exchange-page .btn.good { color:#fff; background:#16794b; border-color:#16794b; }
  body.exchange-page .btn.reject,
  body.exchange-page .btn.bad { color:#fff; background:#b83240; border-color:#b83240; }
  body.exchange-page .table-wrap { border-color:#dbe5f1; }
  body.exchange-page table.t { color:#17345a; }
  body.exchange-page table.t th {
    background:#edf3fa; color:#3c5778; border-bottom-color:#d7e2ef;
  }
  body.exchange-page table.t td { color:#203a5c; border-bottom-color:#e5ecf4; }
  body.exchange-page table.t tbody tr:hover td { background:#f6f9fe; }
  body.exchange-page table.t td b { color:#17345a; }
  body.exchange-page .empty { color:#657c99; }
  body.exchange-page .empty b { color:#18365f; }

</head>
<body class="exchange-page">
<main id="main" class="wrap wide">
  <section class="band">
    <div><h1>JAIN STOCK EXCHANGE</h1><p>Review submitted orders before they move into bank settlement.</p></div>
    <span class="tag">Exchange control</span>
  </section>
  <div class="kpis k4" id="kpis"></div>
  <div class="alert warn hidden" id="closedNote" style="margin-bottom:16px"></div>
  <section class="card">
    <div class="card-h bar"><h2>Pending exchange transactions <span class="muted" id="pendCount" style="font-weight:600;letter-spacing:0"></span></h2>
      <div class="row">
        <input class="input sm hidden" id="q" type="search" aria-hidden="true">
        <button class="btn good sm caps hidden" type="button" id="bulk">✓ Approve all clear</button>
        <span class="meta" id="conn">Review queue</span>
      </div>
    </div>
    <div class="txn-grid" id="rows"><div class="empty">Loading…</div></div>
  </section>
  <section class="card" style="margin-top:18px">
    <div class="card-h bar navy"><h2>Recent exchange decisions</h2><span class="meta">Latest 25</span></div>
    <div class="card-b flush"><div class="table-wrap" style="max-height:380px"><table class="t">
      <thead><tr><th>Time</th><th>Order</th><th>Team / Investor</th><th>Stock / IPO</th><th>Side</th><th class="num">Qty @ Price</th><th>Status</th><th>By</th><th>Note</th></tr></thead>
      <tbody id="recent"></tbody></table></div></div>
  </section>
</main>
<script src="/assets/config.js?v=325"></script>
<script src="/assets/jse.js?v=325"></script>
<script>
(function () {
  "use strict";
  var F = JSE.fmt, esc = JSE.esc, N = JSE.toNum, $ = function (id) { return document.getElementById(id); };
  var S = { data: null, canAct: false, busy: {}, q: "" };

  function kpi(k, v, s, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || "&nbsp;") + "</div></div>"; }

  function chip(o) {
    if (o.short_sell_risk) return '<span class="tag red" title="Holding ' + o.holding + ', other open sells ' + o.open_sell_other + '">Short selling</span>';
    if (o.cash_risk) return '<span class="tag red" title="Free cash ' + F.money(o.free_cash) + ', loan room ' + F.money(o.loan_room) + '">Cash short</span>';
    if (o.loan_needed) return '<span class="tag amber" title="The Bank will draw a loan for the shortfall">Loan needed</span>';
    return '<span class="tag clear">Clear</span>';
  }
  function field(k, v, sub) { return '<div class="txn-f"><div class="k">' + k + '</div><div class="v">' + v + (sub ? ' <span class="sub">' + sub + "</span>" : "") + "</div></div>"; }

  function card(o) {
    var inst = o.account_type === "INSTITUTION", side = o.team_side || o.side;
    var notes = [];
    if (o.short_sell_risk) notes.push('<div class="alert bad"><b>Short selling:</b> ' + esc(o.team) + " can sell only " + F.num(Math.max(0, o.available_qty)) + " (holding " + F.num(o.holding) + ").</div>");
    if (o.cash_risk) notes.push('<div class="alert bad"><b>Cash short:</b> free ' + F.money(o.free_cash) + " + loan room " + F.money(o.loan_room) + " < " + F.money(o.settlement_amount) + ".</div>");
    if (inst) notes.push('<div class="alert info"><b>Institutional counterparty:</b> ' + esc(o.price_basis || "") + "</div>");
    return '<article class="txn' + (o.short_sell_risk || o.cash_risk ? " risk" : "") + '" data-id="' + o.id + '" data-order="' + esc(o.order_no) + '">' +
      '<div class="txn-h"><div class="l"><span class="no">' + esc(o.order_no) + '</span><span class="tag">' + (inst ? "Institutional" : "Participant") + "</span></div>" + chip(o) + "</div>" +
      field("Team / Investor", esc(o.team), esc(o.team_name || "")) +
      field("Broker", esc(o.broker || "—"), esc(o.broker_name || "")) +
      field("Stock / IPO", esc(o.security), esc(o.symbol)) +
      '<div class="txn-trio"><div><div class="k">Side</div><div class="v side-txt ' + side.toLowerCase() + '">' + esc(side) + '</div></div><div><div class="k">Quantity</div><div class="v">' + F.num(o.quantity) +
      '</div></div><div><div class="k">Price</div><div class="v">' + F.price(o.price) + "</div></div></div>" +
      (notes.length ? '<div class="txn-notes">' + notes.join("") + "</div>" : "") +
      (S.canAct ? (o.short_sell_risk
        ? '<div class="txn-a"><span class="muted small">Short sales cannot be approved.</span><button class="btn reject" data-a="REJECT">✕ Reject</button></div>'
        : '<div class="txn-a"><button class="btn approve" data-a="APPROVE">✓ Approve</button><button class="btn reject" data-a="REJECT">✕ Reject</button></div>')
        : '<div class="txn-a one"><span class="muted small center">View only</span></div>') + "</article>";
  }

  function render() {
    var d = S.data; if (!d) return;
    var pend = d.pending.filter(function (o) {
      if (!S.q) return true; var q = S.q.toLowerCase();
      return (o.order_no + " " + o.team + " " + (o.team_name || "") + " " + o.symbol + " " + o.security + " " + (o.broker || "") + " " + (o.slip_no || "")).toLowerCase().indexOf(q) >= 0;
    });
    var flagged = d.pending.filter(function (o) { return o.short_sell_risk || o.cash_risk; }).length;
    $("kpis").innerHTML = kpi("Pending", F.num(d.counts.pending), "executed · oldest first") +
      kpi("Trade orders", F.num(d.counts.trade_orders || 0), F.num(d.counts.institutional_orders || 0) + " institutional") +
      kpi("Short selling", F.num(d.counts.short_selling || 0), flagged + " flagged for review", (d.counts.short_selling || flagged) ? "bad" : "") +
      kpi("Action", d.counts.pending ? "REVIEW" : "CLEAR", F.num(d.counts.approved) + " approved · " + F.num(d.counts.rejected) + " rejected");
    $("pendCount").textContent = "(" + d.pending.length + ")";
    $("rows").innerHTML = pend.length ? pend.map(card).join("")
      : '<div class="empty" style="grid-column:1/-1"><b>No pending exchange transactions.</b>New orders appear here as soon as they are created.</div>';
    $("recent").innerHTML = d.recent.length ? d.recent.map(function (o) {
      return "<tr><td>" + F.time(o.exchange_at) + "</td><td><b>" + esc(o.order_no) + "</b></td><td>" + esc(o.team) + "</td><td>" + esc(o.security) + '<span class="sub">' + esc(o.symbol) + "</span></td><td>" +
        JSE.badge.side(o.team_side || o.side) + '</td><td class="num">' + F.num(o.quantity) + " @ " + F.price(o.price) + "</td><td>" + JSE.badge.status(o.status, o.reject_code) + "</td><td>" +
        esc(o.exchange_by || "—") + '</td><td class="small">' + esc(o.reject_reason || "") + "</td></tr>";
    }).join("") : '<tr><td colspan="9" class="empty">No decisions yet.</td></tr>';
  }

  async function load() {
    S.data = await JSE.api.get("/api/exchange");
    render();
    $("conn").textContent = "Review queue · " + new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour12: true }).toLowerCase();
  }

  async function decide(id, action) {
    if (S.busy[id]) return; S.busy[id] = true;
    var o = S.data.pending.filter(function (x) { return x.id === id; })[0];
    try {
      var body = { order_id: id, action: action };
      if (action === "REJECT") {
        var reason = await JSE.dialog({ title: "Reject " + (o ? o.order_no : "order"), text: "The order will not reach the Bank.", confirmText: "Reject order", danger: true,
          input: { label: "Reason (shown to the broker)", placeholder: "e.g. Slip incomplete / price not agreed" } });
        if (!reason) return;
        body.reason = reason === true ? "" : reason;
      }
      if (action === "APPROVE" && o && o.short_sell_risk) {
        JSE.toast("Short selling is prohibited. Reject the order or reduce the quantity to the shares available.", "bad");
        return;
      }
      var r = await JSE.api.post("/api/exchange", body);
      JSE.toast((o ? o.order_no : "Order") + " → " + JSE.STATUS_TEXT[r.status], r.status === "EXCHANGE_APPROVED" ? "good" : "warn");
      S.data.pending = S.data.pending.filter(function (x) { return x.id !== id; }); render();
    } catch (e) {
      JSE.toast(e.message, "bad");
    } finally { S.busy[id] = false; if (poller) poller.now(); }
  }

  async function bulk() {
    var clean = (S.data ? S.data.pending : []).filter(function (o) { return !o.short_sell_risk && !o.cash_risk && o.account_type === "TEAM"; });
    if (!clean.length) return JSE.toast("No clear orders to approve.", "warn");
    var ok = await JSE.dialog({ title: "Approve " + clean.length + " clear order(s)?", text: "Orders with short-selling or cash warnings and institutional orders are skipped. Each order is still re-checked by the Bank.", confirmText: "Approve " + clean.length });
    if (!ok) return;
    var done = 0, failed = 0;
    for (var i = 0; i < clean.length; i++) {
      try { await JSE.api.post("/api/exchange", { order_id: clean[i].id, action: "APPROVE" }); done++; } catch (e) { failed++; }
    }
    JSE.toast("Approved " + done + (failed ? ", " + failed + " skipped (already handled)" : ""), failed ? "warn" : "good");
    poller.now();
  }

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-a]"); if (!b) return;
    var c = b.closest(".txn"); decide(Number(c.getAttribute("data-id")), b.getAttribute("data-a"));
  });
  $("q").addEventListener("input", JSE.debounce(function (e) { S.q = e.target.value.trim(); render(); }, 150));
  $("bulk").addEventListener("click", bulk);

  var poller;
  JSE.page({ id: "exchange" }).then(function (user) {
    if (!user) return;
    S.canAct = user.role === "ADMIN" || user.role === "EXCHANGE";
    if (!S.canAct) $("bulk").classList.add("hidden");
    JSE.onStatus(function (s) {
      var open = s === "LIVE" || s === "SETTLEMENT_ONLY", n = $("closedNote");
      n.classList.toggle("hidden", open);
      n.innerHTML = open ? "" : "<b>Market is " + esc((JSE.STATUS[s] || {}).text || s) + ".</b> Exchange decisions are possible only while the market is LIVE or paused for settlement.";
    });
    poller = JSE.poll(load, 5000, { onError: function (e) { $("conn").textContent = "Reconnecting… " + e.message; } });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Intelligence · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=272.1">
<style>
  .mini { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: center; font-size: 13.5px; }
  .mini:last-child { border-bottom: 0; }
  .mini b { font-weight: 800; }
  .winner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: #fff; border: 1px solid #c4e6cf; border-left: 6px solid var(--green); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .winner .t { font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: var(--green-2); text-transform: uppercase; }
  .winner .n { font-size: 26px; font-weight: 900; color: var(--navy); }
  .winner .v { font-size: 26px; font-weight: 900; color: var(--green-2); text-align: right; }
  .breadth-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-3); margin-top: 8px; }
  .breadth-bar i { display: block; height: 100%; } .breadth-bar .a { background: var(--green); } .breadth-bar .u { background: #9db4d6; } .breadth-bar .d { background: var(--red); }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><div class="eyebrow">Live analytics</div><h1>Market Intelligence</h1><p id="pool">&nbsp;</p></div>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
  </div>
  <div class="winner" id="winner"><div><div class="t">Leader</div><div class="n">—</div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid cols-3">
    <div class="card"><div class="card-h"><h2>Top gainers</h2><span class="small muted">vs opening price</span></div><div id="gainers"></div></div>
    <div class="card"><div class="card-h"><h2>Top losers</h2><span class="small muted">vs opening price</span></div><div id="losers"></div></div>
    <div class="card"><div class="card-h"><h2>Market breadth</h2></div><div class="card-b" id="breadth"></div></div>
    <div class="card"><div class="card-h"><h2>Leaderboard · Net Worth</h2><span class="small muted" id="lbNote"></span></div><div id="leaders"></div></div>
    <div class="card"><div class="card-h"><h2>Most traded companies</h2></div><div id="traded"></div></div>
    <div class="card"><div class="card-h"><h2>Latest market news</h2></div><div id="news"></div></div>
    <div class="card"><div class="card-h"><h2>Institutional activity</h2></div><div id="inst"></div></div>
    <div class="card" style="grid-column: span 2"><div class="card-h"><h2>Trade tape</h2></div><div id="tape"></div></div>
  </div>
</main>
<script src="/assets/config.js?v=272.1"></script>
<script src="/assets/jse.js?v=272.1"></script>
<script>
(function () {
  var F = JSE.fmt, esc = JSE.esc, N = JSE.toNum, $ = function (id) { return document.getElementById(id); };
  function kpi(k, v, s, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || "&nbsp;") + "</div></div>"; }
  function list(rows, empty) { return rows.length ? rows.join("") : '<div class="empty">' + empty + "</div>"; }
  async function load() {
    var d = await JSE.api.get("/api/insights");
    $("pool").textContent = "Winner pool: " + d.winner_pool + " · winner = highest eligible Net Worth (cash + holdings; loans not deducted)";
    var w = d.winner;
    $("winner").innerHTML = w ? '<div><div class="t">' + (d.status === "CLOSED" || d.status === "FINALIZED" ? "Winner" : "Current leader (provisional)") + '</div><div class="n">' + esc(w.team) + (w.name && w.name !== "Team " + w.team.slice(5) ? " · " + esc(w.name) : "") + "</div></div>" +
      '<div><div class="t" style="text-align:right">Net worth</div><div class="v">' + F.money(w.net_worth) + '</div><div class="right ' + F.dir(w.pnl) + '" style="font-weight:800">' + F.signedMoney(w.pnl) + " (" + F.pct(w.return_pct) + ")</div></div>"
      : '<div><div class="t">Winner</div><div class="n">No eligible team yet</div></div>';
    var idx = d.index, nw = d.net_worth, t = d.totals;
    $("kpis").innerHTML = kpi("CMS Index", new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2 }).format(N(idx.value)), F.arrowPct(idx.change_pct), F.dir(idx.change_pct) === "down" ? "bad" : "good") +
      kpi("Highest net worth", F.short(nw.highest), "across " + nw.teams + " teams", "good") + kpi("Average net worth", F.short(nw.average), "lowest " + F.short(nw.lowest), "info") +
      kpi("Total trade value", F.short(t.trade_value), F.num(t.trades) + " settled trades", "accent") + kpi("Total brokerage", F.money(t.brokerage), "0.5% per trade", "info") +
      kpi("Orders", F.num(d.orders.total), d.orders.pending + " pending · " + d.orders.rejected + " rejected", "warn");
    var mover = function (s) { return '<div class="mini"><span><b>' + esc(s.symbol) + '</b> <span class="muted small">' + esc(s.name) + "</span></span><span>" + F.price(s.price) + '</span><span class="' + F.dir(s.day_change_pct) + '" style="font-weight:800">' + F.arrowPct(s.day_change_pct) + "</span></div>"; };
    $("gainers").innerHTML = list(d.top_gainers.map(mover), "No gainers yet.");
    $("losers").innerHTML = list(d.top_losers.map(mover), "No losers yet.");
    var b = d.breadth, tot = Math.max(1, b.advances + b.declines + b.unchanged);
    $("breadth").innerHTML = '<div class="row between"><span class="up"><b>▲ ' + b.advances + '</b> advances</span><span class="flat"><b>■ ' + b.unchanged + '</b> unchanged</span><span class="down"><b>▼ ' + b.declines + "</b> declines</span></div>" +
      '<div class="breadth-bar"><i class="a" style="width:' + (b.advances / tot * 100) + '%"></i><i class="u" style="width:' + (b.unchanged / tot * 100) + '%"></i><i class="d" style="width:' + (b.declines / tot * 100) + '%"></i></div>' +
      '<p class="small muted" style="margin:10px 0 0">Compared with each security’s opening (base) price.</p>';
    $("lbNote").textContent = d.status === "CLOSED" || d.status === "FINALIZED" ? "eligible teams" : "all teams · provisional";
    $("leaders").innerHTML = list(d.leaderboard.map(function (x) { return '<div class="mini"><span><b>#' + x.rank + " " + esc(x.team) + "</b>" + (x.cash_rule_met ? "" : ' <span class="badge warn" title="Does not meet the ₹50K closing cash rule yet">₹50K</span>') + "</span><span><b>" + F.money(x.net_worth) + '</b></span><span class="' + F.dir(x.pnl) + '">' + F.pct(x.return_pct) + "</span></div>"; }), "No teams yet.");
    $("traded").innerHTML = list(d.most_traded.map(function (s) { return '<div class="mini"><span><b>' + esc(s.symbol) + "</b> " + JSE.badge.kind(s.kind) + "</span><span>" + F.num(s.trade_count) + " trades</span><span><b>" + F.short(s.traded_value) + "</b></span></div>"; }), "No trades yet.");
    $("news").innerHTML = list((d.latest_news || []).map(function (n) { return '<div class="mini"><span><b>' + esc(n.symbol) + '</b> <span class="small muted">' + esc(n.mood) + " · " + F.time(n.created_at) + '</span></span><span>' + F.price(n.previous_price) + " → " + F.price(n.new_price) + '</span><span class="' + F.dir(n.applied_pct) + '" style="font-weight:800">' + F.pct(n.applied_pct) + "</span></div>"; }), "No market news yet.");
    var ins = d.institutional || { accounts: [], recent: [] };
    $("inst").innerHTML = ins.accounts.map(function (a) { return '<div class="mini"><span><b>' + esc(a.code) + "</b> " + esc(a.name) + "</span><span>cash " + F.short(a.cash) + "</span><span>holdings " + F.short(a.holdings_value) + "</span></div>"; }).join("") +
      list(ins.recent.map(function (o) { return '<div class="mini"><span>' + JSE.badge.side(o.side) + " <b>" + esc(o.symbol) + '</b> <span class="small muted">vs ' + esc(o.counterparty) + "</span></span><span>" + F.num(o.quantity) + " @ " + F.price(o.price) + "</span><span>" + JSE.badge.status(o.status) + "</span></div>"; }), "No institutional orders yet.");
    $("tape").innerHTML = list(d.tape.map(function (x) { return '<div class="mini"><span>' + F.time(x.at) + " · <b>" + esc(x.symbol) + "</b> " + JSE.badge.side(x.side) + (x.account_type === "INSTITUTION" ? ' <span class="badge inst">INST</span>' : "") + "</span><span>" + F.num(x.quantity) + " @ " + F.price(x.price) + '</span><span class="' + F.dir(N(x.price) - N(x.price_before)) + '">' + F.price(x.price_before) + " → " + F.price(x.price) + "</span></div>"; }), "No trades yet.");
    $("conn").className = "conn"; $("connText").textContent = "Live · updated " + F.time(d.server_time);
  }
  JSE.page({ id: "insights" }).then(function () { JSE.poll(load, 5000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } }); });
})();
</script>
</body>
</html>

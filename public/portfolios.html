<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participant Portfolios · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=322">
<style>
  .controls { display: grid; grid-template-columns: 260px minmax(0, 1fr) 260px auto; gap: 12px; align-items: end; }
  @media (max-width: 1000px) { .controls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .controls { grid-template-columns: minmax(0, 1fr); } }
  tr.pick { cursor: pointer; }
  .dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1100px) { .dgrid { grid-template-columns: 1fr; } }
  .sec-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #475467; text-transform: uppercase; margin: 22px 0 12px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gaps { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
  .minis.ten { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1280px) { .minis.ten { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .minis.ten { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mini .v.up { color: var(--green); } .mini .v.down { color: var(--red); }
  .ipo-preview { white-space: normal; line-height: 1.35; max-width: 500px; margin-top: 3px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><h1 id="title">Participant Portfolios</h1><p id="poolRule">Live participant wealth, holdings, cash and transaction position across all JSE teams.</p></div>
    <div class="tools"><span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
      <button class="btn sm hidden" type="button" id="exportBtn">Export portfolios (CSV)</button></div>
  </div>

  <section class="rules" id="rules" style="margin-bottom:18px"></section>

  <section id="listView">
    <div class="awards" id="awards" style="margin-bottom:16px"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card" style="margin-bottom:16px"><div class="card-b">
      <div class="controls">
        <div class="field"><label for="teamSel">Portfolio</label><select class="input" id="teamSel"></select></div>
        <div class="field"><label for="q">Search</label><input class="input" id="q" type="search" placeholder="Team code, name, broker, section"></div>
        <div class="chips rankby" role="group" aria-label="Ranking option">
          <button class="chip" type="button" data-sort="net_worth" aria-pressed="true">Rank by Net Worth</button><button class="chip" type="button" data-sort="cash" aria-pressed="false">Rank by Liquid Cash</button>
          <button class="chip" type="button" data-sort="holdings" aria-pressed="false">Rank by Holdings Value</button><button class="chip" type="button" data-sort="pnl" aria-pressed="false">Rank by P/L</button>
          <button class="chip" type="button" data-sort="return" aria-pressed="false">Rank by Return</button><button class="btn sm" type="button" id="refreshBtn">Refresh</button></div>
        <div class="field hidden"><label for="sort">Ranking option</label><select class="input" id="sort">
          <option value="net_worth">Net Worth (official ranking)</option><option value="cash">Cash</option><option value="holdings">Holdings</option>
          <option value="pnl">P/L</option><option value="return">Return</option><option value="eligible">Eligible first (award order)</option><option value="team">Team code</option></select></div>
        <div class="chips" role="group" aria-label="View">
          <button class="chip" type="button" data-v="all" aria-pressed="true">All teams</button>
          <button class="chip" type="button" data-v="eligible" aria-pressed="false">Eligible only</button></div>
      </div>
    </div></div>
    <div class="card"><div class="card-b flush"><div class="table-wrap" style="max-height:72vh"><table class="t">
      <thead><tr><th class="num">#</th><th>Team</th><th>Broker</th><th class="num">Liquid cash</th><th class="num">Holdings value</th><th class="num">Realized P/L</th><th class="num">Unrealized P/L</th>
        <th class="num">Net worth</th><th>BUY / SELL</th><th>Loan</th><th>Closing cash</th><th>Eligibility</th><th>Award</th></tr></thead>
      <tbody id="rows"><tr><td colspan="13" class="empty">Loading…</td></tr></tbody></table></div></div></div>
  </section>

  <section id="detail" class="hidden" style="margin-top:18px" aria-live="polite"></section>
</main>
<script src="/assets/config.js?v=322"></script>
<script src="/assets/jse.js?v=322"></script>
<script>
(function () {
  "use strict";
  var F = JSE.fmt, esc = JSE.esc, N = JSE.toNum, $ = function (id) { return document.getElementById(id); };
  var S = { data: null, view: "all", sort: "net_worth", q: "", team: null, detail: null, user: null, cfg: null };
  function kpi(k, v, s, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || "&nbsp;") + "</div></div>"; }
  function mini(k, v, cls) { return '<div class="mini"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>"; }

  function renderRules(c) {
    c = c || {};
    var minB = c.min_buy_trades || 5, minS = c.min_sell_trades || 5;
    $("rules").innerHTML =
      '<div class="rule key wide"><b>Official winner criterion</b>Net Worth = Liquid Cash + (Shares Held × Closing Price). Assessment: minimum ' + minB + " settled BUY and " + minS + " settled SELL trades per participant. " +
        "Closing cash limit: at market closing a team can hold at most " + F.money(c.cash_rule_limit || 100000) + " (5% of " + F.money(c.initial_capital || 2000000) + ") as cash. Cash generated from trading profits is exempt, provided the initial capital has been fully invested. " +
        "Exactly one Winner and one Runner-Up among eligible teams.</div>";
  }

  function metric(t) {
    return { net_worth: N(t.net_worth), cash: N(t.cash), holdings: N(t.holdings_value), pnl: N(t.pnl), return: N(t.return_pct) }[S.sort];
  }
  function rows() {
    var list = S.data.teams.slice();
    if (S.q) { var q = S.q.toLowerCase(); list = list.filter(function (t) { return [t.code, t.name, t.broker, t.broker_name, t.section].join(" ").toLowerCase().indexOf(q) >= 0; }); }
    if (S.view === "eligible") list = list.filter(function (t) { return t.eligible; });
    if (S.sort === "team") list.sort(function (a, b) { return JSE.teamSort(a.code, b.code); });
    else if (S.sort === "eligible") list.sort(function (a, b) { return (a.rank_eligible || 1e6) - (b.rank_eligible || 1e6) || N(b.net_worth) - N(a.net_worth) || JSE.teamSort(a.code, b.code); });
    else list.sort(function (a, b) { return metric(b) - metric(a) || JSE.teamSort(a.code, b.code); });
    return list;
  }

  function awardCard(cls, title, t, final) {
    return '<div class="award ' + cls + '"><div class="k">' + title + (final ? " · final" : " · provisional") + "</div>" +
      (t ? '<div class="n">' + esc(t.name) + ' <span class="tag">' + esc(t.code) + '</span></div><div class="small" style="margin-top:4px">Net Worth <b>' + F.money(t.net_worth) + "</b> · broker " + esc(t.broker || "—") + " · BUY " + t.settled_buys + " · SELL " + t.settled_sells + "</div>"
         : '<div class="n muted">No eligible team yet</div><div class="small muted">A team becomes eligible once it meets every criterion.</div>') + "</div>";
  }

  function render() {
    var d = S.data; if (!d) return;
    var st = d.stats;
    $("poolRule").textContent = "Wealth and ranking dashboard. " + (d.final ? "Final evaluation (market " + ((JSE.STATUS[d.event_status] || {}).text || d.event_status).toLowerCase() + ")." : "Provisional while the market is open — the closing cash criterion is evaluated at the close.") +
      " Official ranking: Net Worth.";
    $("awards").innerHTML = awardCard("w", "Winner", d.winner, d.final) + awardCard("r", "Runner-Up", d.runner_up, d.final);
    $("kpis").innerHTML = kpi("Teams", F.num(st.teams), F.num(st.profitable) + " in profit") +
      kpi("Eligible", F.num(st.eligible) + " / " + F.num(st.teams), d.final ? "final" : "provisional", N(st.eligible) ? "good" : "") +
      kpi("Assessment met", F.num(st.assessment_met), d.min_buy_trades + " BUY + " + d.min_sell_trades + " SELL settled") +
      kpi("Loans not repaid", F.num(st.loans_unpaid), F.money(st.loans_outstanding) + " outstanding", N(st.loans_unpaid) ? "warn" : "") +
      kpi("Highest net worth", F.money(st.highest_net_worth), "average " + F.money(st.average_net_worth)) +
      kpi("Closing cash met", F.num(st.cash_rule_met) + " / " + F.num(st.teams), "base cash ≤ " + F.money(d.cash_rule_limit));
    var list = rows(), ranked = S.sort !== "team" && S.sort !== "eligible";
    $("rows").innerHTML = list.length ? list.map(function (t, i) {
      var ipoRows = (t.ipo_allotments || []).filter(function (x) { return N(x.quantity) > 0; });
      var ipoSummary = ipoRows.length ? '<span class="sub ipo-preview">IPO allotment: ' + ipoRows.map(function (x) { return esc(x.symbol) + " " + F.num(x.quantity) + " @ " + F.price(x.price); }).join(" · ") + "</span>" : '<span class="sub ipo-preview">No IPO allotment</span>';
      var brokerCode = t.roster_broker_code || t.broker || "—";
      var brokerName = t.roster_broker_name || t.broker_name || "";
      return '<tr class="pick' + (t.award ? " winner" : "") + (S.team === t.code ? " sel" : "") + '" data-team="' + esc(t.code) + '" tabindex="0">' +
        '<td class="num"><b>' + (ranked ? i + 1 : t.rank) + "</b>" + (ranked && S.sort !== "net_worth" ? '<span class="sub">NW #' + t.rank + "</span>" : "") + "</td>" +
        "<td><b>" + esc(t.name) + '</b><span class="sub">' + esc(t.code) + (t.section ? " · " + esc(t.section) : "") + "</span>" + ipoSummary + "</td><td>" + esc(brokerCode) + '<span class="sub">' + esc(brokerName) + "</span></td>" +
        '<td class="num">' + F.money(t.cash) + '</td><td class="num">' + F.money(t.holdings_value) + '</td><td class="num ' + F.dir(t.realized_pnl) + '">' + F.signedMoney(t.realized_pnl) +
        '</td><td class="num ' + F.dir(t.unrealized_pnl) + '">' + F.signedMoney(t.unrealized_pnl) + '</td><td class="num"><b>' + F.money(t.net_worth) + '</b><span class="sub ' + F.dir(t.pnl) + '">' + F.pct(t.return_pct) + "</span></td>" +
        "<td>" + JSE.badge.progress(t.settled_buys, t.min_buy_trades, "BUY") + " " + JSE.badge.progress(t.settled_sells, t.min_sell_trades, "SELL") + "</td>" +
        "<td>" + (N(t.loan_liability) > 0 ? '<span class="badge warn">Outstanding</span><span class="sub">' + F.money(t.loan_liability) + "</span>" : t.loan_original > 0 ? '<span class="badge ok">Repaid</span>' : '<span class="muted small">No loan</span>') + "</td>" +
        "<td>" + JSE.badge.rule(t.cash_rule_met, t.cash_rule_status) + "</td><td>" + JSE.badge.eligibility(t.eligibility_status) + (t.rank_eligible ? '<span class="sub">#' + t.rank_eligible + " eligible</span>" : "") + "</td>" +
        "<td>" + JSE.badge.award(t.award) + "</td></tr>";
    }).join("") : '<tr><td colspan="13" class="empty">No teams match.</td></tr>';
    var sel = $("teamSel"); if (sel.options.length < 2) {
      sel.innerHTML = '<option value="">Select team…</option>' + d.teams.slice().sort(function (a, b) { return JSE.teamSort(a.code, b.code); }).map(function (t) { return '<option value="' + esc(t.code) + '">' + esc(t.code) + " · " + esc(t.name) + "</option>"; }).join("");
      if (S.team) sel.value = S.team;
    }
  }

  function table(head, body, empty) {
    return '<div class="card"><div class="table-wrap"><table class="t"><thead><tr>' + head.map(function (h) { return "<th" + (h[1] ? ' class="num"' : "") + ">" + h[0] + "</th>"; }).join("") + "</tr></thead><tbody>" +
      (body.length ? body.join("") : '<tr><td colspan="' + head.length + '" class="empty">' + empty + "</td></tr>") + "</tbody></table></div></div>";
  }

  function renderDetail() {
    var d = S.detail, box = $("detail"); if (!d) { box.classList.add("hidden"); return; }
    var t = d.team, l = d.loan || {}, c = d.capital || {}, id = d.identity, b = d.broker, a = d.assessment, el = d.eligibility, participant = S.user && S.user.role === "PARTICIPANT";
    var rosterTeam = S.data && S.data.teams ? S.data.teams.filter(function (x) { return x.code === id.code; })[0] : null;
    var brokerDisplayName = rosterTeam && rosterTeam.roster_broker_name || (b && b.name) || "Not assigned yet";
    var brokerDisplayCode = rosterTeam && rosterTeam.roster_broker_code || (b && b.code) || "";
    var loanStatus = !l.original_principal ? "AVAILABLE" : l.repaid ? "REPAID" : "OUTSTANDING";
    box.classList.remove("hidden");
    box.innerHTML =
      '<div class="idcard"><div><div class="eyebrow">' + (participant ? "Your team" : "Team") + '</div><div class="big">' + esc(id.name) + '</div><div class="code">' + esc(id.code) + (id.section ? " · Section " + esc(id.section) : "") + "</div>" +
        (id.name_meaning ? '<div class="meaning">' + esc(id.name_meaning) + (id.name_category ? " · " + esc(id.name_category) : "") + "</div>" : "") +
        '<div class="small" style="margin-top:6px">' + (id.members ? esc(id.members) : '<span class="muted">Members not entered yet</span>') + "</div></div>" +
      '<div><div class="eyebrow">Assigned broker</div><div class="big">' + esc(brokerDisplayName) + '</div><div class="code">' + esc(brokerDisplayCode) + "</div>" +
        (b && (b.desk || b.contact) ? '<div class="small" style="margin-top:6px">' + esc([b.desk ? "Desk " + b.desk : "", b.contact].filter(Boolean).join(" · ")) + "</div>" : "") +
        '<div class="small muted" style="margin-top:8px">' + (participant ? "Your broker creates every order for your team; follow them in Order Tracking." : "") +
        (S.user && S.user.role !== "PARTICIPANT" ? ' <button class="btn sm" type="button" id="closeDetail">Close</button>' : "") + "</div></div></div>" +
      '<div class="minis ten" style="margin-top:16px">' +
        mini("Base capital", F.money(c.base_capital)) + mini("Loan sanctioned", F.money(c.loan_sanctioned)) + mini("Base cash left", F.money(c.base_money_left)) +
        mini("Loan available", F.money(c.loan_available)) + mini("Liquid cash", F.money(c.liquid_cash)) + mini("Holdings market value", F.money(c.holdings_value)) +
        mini("Net worth", F.money(c.net_worth)) + mini("Portfolio P/L", F.signedMoney(c.portfolio_pnl), F.dir(c.portfolio_pnl)) + mini("Realized P/L", F.signedMoney(c.realized_pnl), F.dir(c.realized_pnl)) +
        mini("Unrealized P/L", F.signedMoney(c.unrealized_pnl), F.dir(c.unrealized_pnl)) + mini("Brokerage paid", F.money(c.brokerage_paid)) + mini("Rank (net worth)", "#" + t.rank + (t.rank_eligible ? " · #" + t.rank_eligible + " eligible" : "")) + "</div>" +
      '<p class="small muted" style="margin-top:8px">Base cash left includes loan proceeds still held as cash. Profit-generated cash is excluded from this figure; loan liability and repayment remain shown separately.</p>' +
      '<div class="sec-title">Participant loan</div>' +
      '<div class="minis" style="grid-template-columns:repeat(6,minmax(0,1fr))">' +
        mini("Loan remaining", F.money(l.current_principal || 0)) + mini("Principal repaid", F.money(l.principal_repaid || 0)) + mini("Interest rate", JSE.rate(d.rules.loan_rate)) +
        mini("Interest due", F.money(l.interest || 0)) + mini("Interest paid", F.money(l.interest_paid || 0)) + mini("Loan status", loanStatus) + "</div>" +
      '<div class="dgrid" style="margin-top:16px">' +
        '<div class="card"><div class="card-h bar"><h3>Assessment</h3>' + JSE.badge.award(t.award) + '</div><div class="card-b">' +
          '<div class="row">' + JSE.badge.progress(a.buy, a.min_buy, "BUY") + JSE.badge.progress(a.sell, a.min_sell, "SELL") + (a.met ? '<span class="badge ok">Assessment met</span>' : "") + "</div>" +
          '<p class="small muted" style="margin:10px 0 0">' + esc(a.basis) + "</p>" +
          (el.gaps && el.gaps.length ? '<div class="small" style="margin-top:10px"><b>Still needed for eligibility:</b></div><ul class="gaps">' + el.gaps.map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("") + "</ul>" : '<p class="small" style="margin:10px 0 0"><b class="up">All criteria met.</b></p>') +
        "</div></div>" +
        '<div class="card"><div class="card-h bar green"><h3>Final eligibility</h3>' + JSE.badge.eligibility(el.status) + '</div><div class="card-b"><dl class="dl">' +
          "<dt>Settled BUY / SELL</dt><dd>" + a.buy + " / " + a.min_buy + " · " + a.sell + " / " + a.min_sell + "</dd>" +
          "<dt>Loan obligations</dt><dd>" + (l.repaid !== false ? '<span class="badge ok">' + (l.original_principal ? "Repaid" : "No loan") + "</span>" : '<span class="badge warn">' + F.money(l.total_liability) + " due</span>") + "</dd>" +
          "<dt>Closing cash criterion</dt><dd>" + JSE.badge.rule(t.cash_rule_met, t.cash_rule_status) + "</dd><dt>Evaluation</dt><dd>" + (el.final ? "Final" : "Provisional until the close") + "</dd></dl>" +
          '<p class="small muted" style="margin:10px 0 0">A team with a high Net Worth that fails any mandatory condition is not an eligible Winner or Runner-Up.</p></div></div>' +
        '<div class="card"><div class="card-h bar red"><h3>₹1,00,000 closing cash criterion</h3></div><div class="card-b"><dl class="dl">' +
          "<dt>Base cash counted</dt><dd>" + F.money(t.base_cash_counted) + "</dd><dt>Profit-generated cash (exempt)</dt><dd>" + F.money(t.profit_cash_exempt) + "</dd><dt>Maximum at the close</dt><dd>" + F.money(d.rules.cash_limit) + "</dd>" +
          "<dt>Status</dt><dd>" + JSE.badge.rule(t.cash_rule_met, t.cash_rule_status) + "</dd></dl>" +
          '<p class="small muted" style="margin:10px 0 0">' + esc(JSE.cashRuleText(d.rules.cash_limit)) + "</p></div></div>" +
      "</div>" +
      '<div class="sec-title">Holdings</div>' +
      table([["Security"], ["Type"], ["Quantity", 1], ["Average price", 1], ["Current price", 1], ["Market value", 1], ["Unrealized P/L (after brokerage)", 1]], d.holdings.map(function (h) {
        return "<tr><td><b>" + esc(h.security) + '</b><span class="sub">' + esc(h.symbol) + "</span></td><td>" + JSE.badge.kind(h.type) + '</td><td class="num">' + F.num(h.quantity) + '</td><td class="num">' + F.price(h.avg_price) +
          '</td><td class="num">' + F.price(h.current_price) + '</td><td class="num"><b>' + F.money(h.market_value) + '</b></td><td class="num ' + F.dir(h.unrealized_pnl) + '">' + F.signedMoney(h.unrealized_pnl) + "</td></tr>"; }), "No holdings yet.") +
      '<div class="small muted" style="margin-top:8px">Realized P/L ' + F.signedMoney(t.realized_pnl) + " · brokerage paid " + F.money(t.brokerage_paid) + " (" + JSE.rate(d.rules.brokerage_rate) + ")</div>" +
      '<div class="sec-title">Recent orders</div>' + table([["Order"], ["Trade"], ["Trade value", 1], ["Status"], ["Created"]], d.recent_orders.map(function (o) {
        var side = o.team_side || o.side;
        return '<tr><td><a class="mono" href="/orders.html?order=' + encodeURIComponent(o.order_no) + '">' + esc(o.order_no) + "</a>" + (o.account_type === "INSTITUTION" ? ' <span class="tag">Institutional</span>' : "") + '</td><td><span class="side-txt ' + side.toLowerCase() + '">' + esc(side) + "</span> · " + F.num(o.quantity) + " <b>" + esc(o.symbol) + "</b> @ " + F.price(o.price) +
          '</td><td class="num">' + F.money(o.trade_value) + "</td><td>" + JSE.badge.status(o.status, o.reject_code) + "</td><td>" + F.datetime(o.created_at) + "</td></tr>"; }), "No orders yet.") +
      (d.ipo_allotments.length || d.ipo_applications.length ? '<div class="sec-title">IPO allotments (not assessment trades)</div>' + table([["IPO"], ["Applied"], ["Allotted lots", 1], ["Shares", 1], ["Price", 1], ["Amount", 1]],
        (d.ipo_allotments.length ? d.ipo_allotments : d.ipo_applications).map(function (x) {
          var app = d.ipo_applications.filter(function (p) { return p.symbol === x.symbol; })[0];
          return "<tr><td><b>" + esc(x.symbol) + "</b></td><td>" + (app ? (app.status === "APPLIED" ? app.lots + " lot(s)" : "withdrawn") : "—") + '</td><td class="num">' + (x.quantity ? x.lots : "—") + '</td><td class="num">' + (x.quantity ? F.num(x.quantity) : "—") +
            '</td><td class="num">' + (x.price ? F.price(x.price) : "—") + '</td><td class="num">' + (x.quantity ? F.money(x.amount) : "—") + "</td></tr>"; }), "") : "") +
      '<div class="sec-title">Cash ledger (latest)</div>' + table([["Time"], ["Type"], ["Debit", 1], ["Credit", 1], ["Balance after", 1], ["Note"]], d.recent_ledger.map(function (r) {
        return "<tr><td>" + F.datetime(r.created_at) + "</td><td>" + esc(F.statusText(r.type)) + '</td><td class="num">' + (N(r.debit) ? F.money(r.debit) : "") + '</td><td class="num">' + (N(r.credit) ? F.money(r.credit) : "") +
          '</td><td class="num">' + F.money(r.balance_after) + '</td><td class="small">' + esc(r.note || "") + (r.order_no && String(r.note || "").indexOf(r.order_no) < 0 ? ' <span class="mono">' + esc(r.order_no) + "</span>" : "") + "</td></tr>"; }), "No entries.");
    var cl = $("closeDetail"); if (cl) cl.onclick = function () { S.team = null; S.detail = null; $("teamSel").value = ""; renderDetail(); render(); };
  }

  async function loadList() {
    S.data = await JSE.api.get("/api/portfolios");
    render();
    $("conn").className = "conn"; $("connText").textContent = "LIVE · UPDATING";
  }
  async function loadDetail() {
    if (!S.team) return;
    var team = S.team;
    var d = await JSE.api.get("/api/portfolio-details", { team: team });
    if (S.team === team) { S.detail = d; renderDetail(); }
  }
  function select(code, scroll) {
    S.team = code || null; $("teamSel").value = code || "";
    if (!code) { S.detail = null; renderDetail(); render(); return; }
    render();
    loadDetail().then(function () { if (scroll) $("detail").scrollIntoView({ behavior: "smooth", block: "start" }); }).catch(function (e) { JSE.toast(e.message, "bad"); });
  }

  $("rows").addEventListener("click", function (e) { var tr = e.target.closest("tr[data-team]"); if (tr) select(tr.getAttribute("data-team"), true); });
  $("rows").addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches("tr[data-team]")) select(e.target.getAttribute("data-team"), true); });
  $("teamSel").addEventListener("change", function () { select($("teamSel").value, true); });
  $("sort").addEventListener("change", function () { S.sort = $("sort").value; render(); });
  document.querySelectorAll("[data-sort]").forEach(function (b) { b.addEventListener("click", function () {
    S.sort = b.getAttribute("data-sort"); $("sort").value = S.sort; document.querySelectorAll("[data-sort]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); render(); }); });
  $("refreshBtn").addEventListener("click", function () { if (window.__pfPoll) window.__pfPoll.now(); });
  $("q").addEventListener("input", JSE.debounce(function (e) { S.q = e.target.value.trim(); render(); }, 150));
  document.querySelectorAll("[data-v]").forEach(function (b) { b.addEventListener("click", function () {
    S.view = b.getAttribute("data-v"); document.querySelectorAll("[data-v]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    render(); }); });
  $("exportBtn").onclick = function () { JSE.download("/api/export?sheet=networth", "JSE_networth.csv").catch(function (e) { JSE.toast(e.message, "bad"); }); };

  JSE.page({ id: "portfolios" }).then(function (user) {
    if (!user) return;
    S.user = user;
    JSE.api.get("/api/event-status").then(function (st) { renderRules(st.config); }).catch(function () { renderRules(); });
    if (user.role === "PARTICIPANT") {
      $("listView").classList.add("hidden"); $("title").textContent = "My Portfolio";
      $("poolRule").textContent = (user.team_name || "") + " · " + user.team + " — your cash, holdings, loan, assessment and final eligibility.";
      S.team = user.team;
      JSE.poll(loadDetail, 15000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } });
      $("conn").className = "conn"; $("connText").textContent = "Live";
      return;
    }
    $("exportBtn").classList.remove("hidden");
    var t = new URLSearchParams(location.search).get("team"); if (t) S.team = t.toUpperCase();
    window.__pfPoll = JSE.poll(loadList, 15000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } });
    JSE.poll(loadDetail, 15000);
  });
})();
</script>
</body>
</html>

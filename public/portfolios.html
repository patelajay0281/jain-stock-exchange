<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participant Portfolios · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=325">
<style>
  .controls { display: grid; grid-template-columns: 260px minmax(0, 1fr) 260px auto; gap: 12px; align-items: end; }
  @media (max-width: 1000px) { .controls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .controls { grid-template-columns: minmax(0, 1fr); } }
  tr.pick { cursor: pointer; }
  .dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1100px) { .dgrid { grid-template-columns: 1fr; } }
  .sec-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #475467; text-transform: uppercase; margin: 22px 0 12px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gaps { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
  .minis.ten { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1280px) { .minis.ten { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .minis.ten { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mini .v.up { color: var(--green); } .mini .v.down { color: var(--red); }
  .ipo-preview { white-space: normal; line-height: 1.35; max-width: 500px; margin-top: 3px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><h1 id="title">Participant Portfolios</h1><p id="poolRule">Live participant wealth, holdings, cash and transaction position across all JSE teams.</p></div>
    <div class="tools"><span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
      <button class="btn sm hidden" type="button" id="exportBtn">Export portfolios (CSV)</button></div>
  </div>

  <section class="rules" id="rules" style="margin-bottom:18px"></section>

  <section id="listView">
    <div class="awards" id="awards" style="margin-bottom:16px"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card" style="margin-bottom:16px"><div class="card-b">
      <div class="controls">
        <div class="field"><label for="teamSel">Portfolio</label><select class="input" id="teamSel"></select></div>
        <div class="field"><label for="q">Search</label><input class="input" id="q" type="search" placeholder="Team code, name, broker, section"></div>
        <div class="chips rankby" role="group" aria-label="Ranking option">
          <button class="chip" type="button" data-sort="net_worth" aria-pressed="true">Rank by Net Worth</button><button class="chip" type="button" data-sort="cash" aria-pressed="false">Rank by Liquid Cash</button>
          <button class="chip" type="button" data-sort="holdings" aria-pressed="false">Rank by Holdings Value</button><button class="chip" type="button" data-sort="pnl" aria-pressed="false">Rank by P/L</button>
          <button class="chip" type="button" data-sort="return" aria-pressed="false">Rank by Return</button><button class="btn sm" type="button" id="refreshBtn">Refresh</button></div>
        <div class="field hidden"><label for="sort">Ranking option</label><select class="input" id="sort">
          <option value="net_worth">Net Worth (official ranking)</option><option value="cash">Cash</option><option value="holdings">Holdings</option>
          <option value="pnl">P/L</option><option value="return">Return</option><option value="eligible">Eligible first (award order)</option><option value="team">Team code</option></select></div>
        <div class="chips" role="group" aria-label="View">
          <button class="chip" type="button" data-v="all" aria-pressed="true">All teams</button>
          <button class="chip" type="button" data-v="eligible" aria-pressed="false">Eligible only</button></div>
      </div>
    </div></div>
    <div class="card"><div class="card-b flush"><div class="table-wrap" style="max-height:72vh"><table class="t">
      <thead><tr><th class="num">#</th><th>Team</th><th>Broker</th><th class="num">Liquid cash</th><th class="num">Holdings value</th><th class="num">Realized P/L</th><th class="num">Unrealized P/L</th>
        <th class="num">Net worth</th><th>BUY / SELL</th><th>Loan</th><th>Closing cash</th><th>Eligibility</th><th>Award</th></tr></thead>
      <tbody id="rows"><tr><td colspan="13" class="empty">Loading…</td></tr></tbody></table></div></div></div>
  </section>

  <section id="detail" class="hidden" style="margin-top:18px" aria-live="polite"></section>

</main>
<script src="/assets/config.js?v=325"></script>
<script src="/assets/jse.js?v=325"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market · JAIN STOCK EXCHANGE</title>
<meta name="description" content="Live market wall for the Dalal Street 2026 trading simulation: CMS 50, market status, the 50 listed CMS stocks, the IPOs and FOX Market Desk news.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/jse.css?v=318">
<style>
  /* Market wall — as on the live Hatchable application */
  body.market-page .hd .wordmark { display: none; }
  body.market-page .hd-in { padding: 2px 16px 0; max-width: none; }
  body.market-page .nav { padding: 2px 16px 0; max-width: none; }
  body.market-page .wrap { padding: 4px 16px 40px; max-width: none; }
  body.market-page .hd-right .ver-pill { display: none !important; }
  .cmsbar { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 4px 18px rgba(16, 24, 40, .06); min-height: 84px; margin-top: 6px; }
  .cmsbar::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--blue); }
  .cmsbar .id { padding: 18px 24px; border-right: 1px solid var(--line-3); }
  .cmsbar .id h1 { margin: 0; font-size: 23px; font-weight: 900; letter-spacing: .06em; color: #0b1220; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmsbar .ix { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px 14px 30px; min-width: 0; }
  .cmsbar .ix .lbl { font-size: 18px; font-weight: 800; letter-spacing: .04em; color: #0b1220; text-transform: uppercase; white-space: nowrap; }
  .cmsbar .ix .num { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
  .cmsbar .ix .val { font-size: 38px; font-weight: 800; color: #0b1220; letter-spacing: -.02em; line-height: 1; }
  .cmsbar .ix .chg { font-size: 13px; font-weight: 800; color: #0b1220; }
  .cmsbar .live { position: absolute; right: 22px; top: -13px; font-size: 12px; font-weight: 800; letter-spacing: .06em; padding: 4px 11px; border-radius: 999px; border: 1px solid #b9dfc6; background: #edf8f0; color: #0b1220; text-transform: uppercase; }
  .cmsbar .live.not-started { background: #f2f4f7; border-color: var(--line); color: var(--muted); }
  .cmsbar .live.settlement { background: #fdf6e7; border-color: #ecd9a8; color: #92400e; }
  .cmsbar .live.closed, .cmsbar .live.finalized { background: #fff0f1; border-color: #f2c6cb; color: var(--red); }
  .cmsbar .live.offline { background: #fff0f1; border-color: #f2c6cb; color: var(--red); }
  .mgrid { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 11px; }
  .tile { position: relative; overflow: hidden; min-width: 0; padding: 13px 15px 12px; border: 1px solid #e5eaf0; border-radius: 9px; background: #fff; box-shadow: 0 1px 3px rgba(16, 24, 40, .04); }
  .tile.up { background: #e9f6ed; border-color: #cfe9d8; }
  .tile.down { background: #fdecef; border-color: #f4cfd5; }
  .tile.up::after, .tile.down::after { content: ""; position: absolute; right: -18px; bottom: -22px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
  .tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .tile-name { font-size: 18px; font-weight: 600; color: #0b1220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .tile-kind { font-size: 7.5px; font-weight: 800; letter-spacing: .08em; color: #344054; text-transform: uppercase; padding-top: 5px; flex: none; }
  .tile-price { margin-top: 8px; font-size: 24px; font-weight: 800; color: #0b1220; letter-spacing: -.005em; line-height: 1.15; white-space: nowrap; }
  .tile-foot { margin-top: 11px; font-size: 12.5px; font-weight: 800; color: #0b1220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 1; }
  .tile.flash-up { animation: flash-up 1.8s ease-out; } .tile.flash-down { animation: flash-down 1.8s ease-out; }
  @keyframes flash-up { from { box-shadow: 0 0 0 3px rgba(22, 128, 60, .5); } to { box-shadow: 0 0 0 3px rgba(22, 128, 60, 0); } }
  @keyframes flash-down { from { box-shadow: 0 0 0 3px rgba(198, 40, 40, .45); } to { box-shadow: 0 0 0 3px rgba(198, 40, 40, 0); } }
  .grid-msg { grid-column: 1 / -1; }
  body.tv .nav, body.tv .hd-right .tb-user { display: none; }
  body.tv .wrap { max-width: none; padding: 12px 16px; }
  @media (max-width: 1500px) { .mgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  @media (max-width: 1200px) { .mgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  @media (max-width: 1000px) { .mgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cmsbar { grid-template-columns: minmax(0, 1fr); } .cmsbar .id { border-right: 0; border-bottom: 1px solid var(--line-3); } .cmsbar .ix { padding-left: 24px; } }
  @media (max-width: 760px) { .mgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .tile { padding: 11px 12px 10px; } .tile-name { font-size: 15px; } .tile-price { font-size: 20px; }
    .cmsbar .id h1 { font-size: 19px; } .cmsbar .ix .val { font-size: 30px; } .cmsbar .ix .lbl { font-size: 15px; }
  }


  /* Market-only compact header: preserve the original tile design and leave every other page unchanged. */
  body.market-page .hd-in { padding-top: 4px; padding-bottom: 0; }
  body.market-page .hd-right > span { display: none !important; }
  body.market-page .nav { padding-top: 0; padding-bottom: 0; }
  body.market-page .wrap { padding-top: 0; }
  body.market-page .cmsbar { margin-top: 0; }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <section class="cmsbar" aria-label="CMS INDEX">
    <span class="live not-started" id="mPill"><span id="mPillText">—</span></span>
    <div class="id"><h1>Jain Stock Exchange</h1></div>
    <div class="ix" aria-live="polite">
      <span class="lbl">CMS INDEX</span>
      <span class="num"><span class="val" id="idxVal">—</span><span class="chg" id="idxChg"></span></span>
      <span class="sr-only" id="idxComp"></span>
    </div>
  </section>
  <ul class="mgrid" id="grid" aria-live="off" aria-label="Market wall"></ul>
  <p class="sr-only" id="disc"></p>
</main>
<script src="/assets/config.js?v=321"></script>
<script src="/assets/jse.js?v=321"></script>
<script>
(function () {
  "use strict";
  var esc = JSE.esc, N = JSE.toNum;
  var REFRESH_MS = 5000;
  var nf0 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  var state = { data: null, last: {} };
  var grid = document.getElementById("grid");
  document.body.classList.add("market-page");
  document.getElementById("disc").textContent = JSE.DISCLAIMER;
  function rupees(v) { return "₹" + nf0.format(Math.round(N(v))); }
  function pctTxt(p) { var n = N(p); return (n > 0 ? "▲ " : n < 0 ? "▼ " : "") + Math.abs(n).toFixed(2) + "%"; }
  function dir(p) { var n = N(p); return n > 0 ? "up" : n < 0 ? "down" : "flat"; }

  // Pin the four IPOs in the first four positions in their configured order,
  // before all equities, whether each IPO is pre-listing or already listed.
  function wall() {
    var d = state.data, m = {};
    (d.ipos || []).concat(d.stocks || []).forEach(function (s) { m[s.symbol] = s; });
    var b = d.board || {};
    var ipoSymbols = (d.ipos || []).map(function (s) { return s.symbol; });
    var equitySymbols = (b.listed_market || []).filter(function (sym) {
      return m[sym] && m[sym].type !== "IPO";
    });
    return ipoSymbols.concat(equitySymbols).map(function (sym) { return m[sym]; }).filter(Boolean);
  }
  function tileHtml(s, flash) {
    var pre = s.type === "IPO" && !s.listed;
    // IPO price-change colour is measured against the participants' allotment/issue price.
    // A saved listing price is applied by Start Event; after that this reflects the change from
    // the allotment baseline, not the new index base set at listing.
    var ipoBase = N(s.base_price);
    var pct = pre ? 0 : (s.type === "IPO" && ipoBase > 0
      ? ((N(s.price) - ipoBase) / ipoBase) * 100
      : s.day_change_pct);
    var dd = pre ? "flat" : dir(pct);
    return '<li class="tile ' + dd + (flash ? " flash-" + flash : "") + '" data-sym="' + esc(s.symbol) + '" title="' + esc(s.name + " · " + s.symbol) + '">' +
      '<div class="tile-top"><div class="tile-name">' + esc(s.name) + '</div><span class="tile-kind">' + (s.type === "IPO" ? "IPO" : "EQUITY") + "</span></div>" +
      '<div class="tile-price">' + rupees(pre ? s.base_price : s.price) + "</div>" +
      '<div class="tile-foot">' + esc(s.symbol) + " · " + pctTxt(pct) + "</div></li>";
  }
  function render() {
    var list = wall(), flashes = {};
    list.forEach(function (s) { var prev = state.last[s.symbol]; if (prev !== undefined && prev !== N(s.price)) flashes[s.symbol] = N(s.price) > prev ? "up" : "down"; });
    grid.innerHTML = list.length ? list.map(function (s) { return tileHtml(s, flashes[s.symbol]); }).join("") : '<li class="grid-msg"><div class="empty">No securities.</div></li>';
    list.forEach(function (s) { state.last[s.symbol] = N(s.price); });
  }
  function renderHead(d) {
    var ix = d.index || {};
    document.getElementById("idxVal").textContent = nf0.format(Math.round(N(ix.value)));
    document.getElementById("idxChg").textContent = pctTxt(ix.change_pct);
    document.getElementById("idxComp").textContent = (ix.components || 0) + " components";
    var cls = { LIVE: "live", NOT_STARTED: "not-started", SETTLEMENT_ONLY: "settlement", CLOSED: "closed", FINALIZED: "finalized" }[d.status] || "closed";
    var txt = { LIVE: "LIVE", NOT_STARTED: "NOT STARTED", SETTLEMENT_ONLY: "PAUSED", CLOSED: "CLOSED", FINALIZED: "FINALIZED" }[d.status] || d.status;
    document.getElementById("mPill").className = "live " + cls;
    document.getElementById("mPillText").textContent = txt;
    JSE.applyStatus(d.status, ix);
  }
  async function load() {
    var d = await JSE.api.get("/api/market", null, { timeout: 9000, retries: 1 });
    state.data = d; renderHead(d); render();
  }
  function onError(e) {
    if (!state.data) grid.innerHTML = '<li class="grid-msg"><div class="empty"><b>The market feed can’t be loaded right now.</b>' + esc(e.message) + "</div></li>";
    document.getElementById("mPill").className = "live offline"; document.getElementById("mPillText").textContent = "RECONNECTING";
    JSE.offline();
  }
  if (/[?&]tv=1/.test(location.search)) document.body.classList.add("tv");
  var poller;
  function installMarketDropdown() {
    var nav = document.querySelector(".nav");
    var navIn = nav && nav.querySelector(".nav-in");
    if (!navIn || document.getElementById("marketNavSelect")) return;
    var links = Array.prototype.slice.call(navIn.querySelectorAll("a"));
    if (!links.length) return;
    var wrap = document.createElement("div");
    wrap.className = "market-nav-wrap";
    var label = document.createElement("label");
    label.className = "market-nav-label";
    label.htmlFor = "marketNavSelect";
    label.textContent = "Go to";
    var select = document.createElement("select");
    select.id = "marketNavSelect";
    select.className = "market-nav-select";
    select.setAttribute("aria-label", "Navigate to page");
    links.forEach(function (link) {
      var option = document.createElement("option");
      option.value = link.getAttribute("href");
      option.textContent = link.textContent.trim();
      option.selected = link.getAttribute("aria-current") === "page";
      select.appendChild(option);
    });
    select.addEventListener("change", function () {
      if (select.value) window.location.href = select.value;
    });
    wrap.appendChild(label);
    wrap.appendChild(select);
    navIn.innerHTML = "";
    navIn.appendChild(wrap);
  }

  JSE.page({ id: "market", statusFromPage: true }).then(function () {
    installMarketDropdown();
    poller = JSE.poll(load, REFRESH_MS, { onError: onError });
  });
})();
</script>
</body>
</html>

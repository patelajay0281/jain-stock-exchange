<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=272">
<style>
  .login { max-width: 420px; margin: 48px auto; }
  .login .card-b { padding: 26px 26px 22px; }
  .login h1 { margin: 0; font-size: 20px; color: var(--navy); letter-spacing: 1px; }
  .login p { margin: 6px 0 18px; color: var(--muted); }
  .login .field + .field { margin-top: 12px; }
  .login .logo { display: block; max-width: 260px; margin: 0 auto 18px; opacity: .95; }
  .roles { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main id="main" class="wrap">
  <div class="login">
    <img class="logo" src="/assets/img/jain-cms-logo.png" alt="JAIN (Deemed-to-be University) · CMS Business School">
    <form class="card" id="f" novalidate>
      <div class="card-b">
        <h1>Desk sign in</h1>
        <p>For event staff: brokers, Exchange, Bank, institutional desk, faculty and administrators.</p>
        <div class="alert bad hidden" id="err" role="alert"></div>
        <div class="alert info hidden" id="info"></div>
        <div class="field"><label for="u">Username</label><input class="input lg" id="u" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required placeholder="e.g. BANK-01"></div>
        <div class="field"><label for="p">Password</label><input class="input lg" id="p" name="password" type="password" autocomplete="current-password" required></div>
        <div style="margin-top:18px"><button class="btn primary lg block" id="go" type="submit">Sign in</button></div>
        <div class="roles">The market page and Market Intelligence are public — no sign-in needed.</div>
      </div>
    </form>
  </div>
</main>
<script src="/assets/config.js?v=272"></script>
<script src="/assets/jse.js?v=272"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var HOME = { ADMIN: "/admin.html", EXCHANGE: "/exchange.html", BANK: "/bank.html", BROKER: "/order.html", INSTITUTIONAL: "/institutional.html", PARTICIPANT: "/portfolios.html", VIEWER: "/portfolios.html" };
  function next(user) {
    var n = params.get("next") || "";
    if (/^\/[A-Za-z0-9._\-\/?=&%]*$/.test(n) && n.indexOf("//") !== 0 && n.indexOf("/login") !== 0) return n;
    return HOME[user.role] || "/";
  }
  JSE.page({ id: "login", roles: "*" }).then(function (user) {
    if (user) { location.replace(next(user)); return; }
    if (params.get("expired")) { var i = document.getElementById("info"); i.textContent = "Your session ended. Please sign in again."; i.classList.remove("hidden"); }
    document.getElementById("u").focus();
  });
  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = document.getElementById("err"), btn = document.getElementById("go");
    err.classList.add("hidden");
    var u = document.getElementById("u").value.trim(), p = document.getElementById("p").value;
    if (!u || !p) { err.textContent = "Enter your username and password."; err.classList.remove("hidden"); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
    try {
      var user = await JSE.session.login(u, p);
      location.replace(next(user));
    } catch (ex) {
      err.textContent = ex.message; err.classList.remove("hidden");
      btn.disabled = false; btn.textContent = "Sign in";
      document.getElementById("p").select();
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=318">
<style>
  .login { max-width: 440px; margin: 20px auto 28px; }
  .login .card-b { padding: 28px 28px 24px; }
  .login h1 { margin: 0; font-size: 24px; color: var(--navy); font-weight: 800; }
  .login p { margin: 6px 0 18px; color: var(--muted); }
  .login .field + .field { margin-top: 12px; }
  .login .logo { display: block; max-width: 260px; margin: 0 auto 18px; opacity: .95; }
  .login h1 { margin-bottom: 18px; }
  .event-credit { text-align: center; margin: 4px auto 24px; font-size: 20px; font-weight: 800; letter-spacing: .02em; color: var(--navy); }
  .ds-logo { display: block; width: 190px; height: auto; margin: 0 auto 10px; }
  .partner-logos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 28px 44px; margin: 0 auto 36px; max-width: 980px; }
  .partner-logos img { height: auto; display: block; }
  .pl-jse { width: 210px; } .pl-fig { width: 200px; } .pl-fox { width: 210px; border-radius: 12px; background: #0b1220; padding: 8px 10px; box-sizing: content-box; }
  @media (max-width: 640px) { .pl-jse, .pl-fig, .pl-fox { width: 150px; } .ds-logo { width: 150px; } }
  .event-credit span { font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<main id="main" class="wrap">
  <div class="login">
    <img class="logo" src="/assets/img/jain-cms-logo.png" alt="JAIN (Deemed-to-be University) · CMS Business School">
    <form class="card" id="f" novalidate>
      <div class="card-b">
        <h1>Sign in</h1>
        <div class="alert bad hidden" id="err" role="alert"></div>
        <div class="alert info hidden" id="info"></div>
        <div class="field"><label for="u">Username</label><input class="input lg" id="u" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required></div>
        <div class="field"><label for="p">Password</label><input class="input lg" id="p" name="password" type="password" autocomplete="current-password" required></div>
        <div style="margin-top:20px"><button class="btn primary lg block caps" id="go" type="submit">Sign in</button></div>
      </div>
    </form>
  </div>
  <p class="event-credit">Dalal Street 2026 <span>by Finance Interest Group</span></p>
  <div class="partner-logos" aria-label="Event partners">
    <img src="/assets/img/jse-logo.webp" width="520" height="260" alt="JAIN Stock Exchange" class="pl-jse">
    <img src="/assets/img/fig-logo.webp" width="440" height="145" alt="FIG · Finance Interest Group" class="pl-fig">
    <img src="/assets/img/fox-market-desk.webp" width="440" height="232" alt="FOX Market Desk — Every story has a market" class="pl-fox">
  </div>
</main>
<script src="/assets/config.js?v=318"></script>
<script src="/assets/jse.js?v=318"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  function next(user) {
    var n = params.get("next") || "";
    if (/^\/[A-Za-z0-9._\-\/?=&%]*$/.test(n) && n.indexOf("//") !== 0 && n.indexOf("/login") !== 0 && JSE.canOpen(n, user.role)) return n;
    return JSE.homeFor(user.role);
  }
  JSE.page({ id: "login", roles: "*" }).then(function (user) {
    if (user) { location.replace(next(user)); return; }
    if (params.get("expired")) { var i = document.getElementById("info"); i.textContent = "Your session ended. Please sign in again."; i.classList.remove("hidden"); }
    document.getElementById("u").focus();
  });
  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = document.getElementById("err"), btn = document.getElementById("go");
    err.classList.add("hidden");
    var u = document.getElementById("u").value.trim(), p = document.getElementById("p").value;
    if (!u || !p) { err.textContent = "Enter your username and password."; err.classList.remove("hidden"); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
    try {
      var user = await JSE.session.login(u, p);
      if (user.must_change_password) {
        btn.textContent = "Signed in";
        await JSE.changePassword({ required: true, oldPassword: p, title: "Choose a new password",
          note: "This account was given a temporary password. Choose your own password to continue." });
      }
      location.replace(next(user));
    } catch (ex) {
      err.textContent = ex.message; err.classList.remove("hidden");
      btn.disabled = false; btn.textContent = "Sign in";
      document.getElementById("p").select();
    }
  });
})();
</script>
</body>
</html>

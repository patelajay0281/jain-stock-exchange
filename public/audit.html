<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=314">
<style>
  .aud-filters { display: grid; grid-template-columns: minmax(220px, 2fr) 260px 180px 200px auto; gap: 12px; align-items: center; }
  @media (max-width: 1100px) { .aud-filters { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .aud-filters { grid-template-columns: minmax(0, 1fr); } }
  pre.js { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; color: var(--ink-2); max-height: 180px; overflow: auto; background: var(--soft); border: 1px solid var(--line-3); border-radius: 8px; padding: 8px 10px; }
  tr.row-main { cursor: pointer; }
  tr.risky td { background: #fffafa; }
  .act { font-weight: 800; font-size: 11.5px; letter-spacing: .03em; color: var(--ink); }
  .act.bad { color: var(--red); } .act.good { color: var(--green-2); }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><h1>Audit Log</h1>
      <p>A clear record of what happened in the exchange, who did it, and which order or team was affected.</p></div>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
  </div>
  <div class="chips" role="group" aria-label="Activity" id="tabs" style="margin-bottom:14px">
    <button class="chip" type="button" data-tab="" aria-pressed="true">All Activity</button><button class="chip" type="button" data-tab="ORDERS" aria-pressed="false">Orders</button>
    <button class="chip" type="button" data-tab="EXCHANGE" aria-pressed="false">Exchange</button><button class="chip" type="button" data-tab="EVENT" aria-pressed="false">Event</button></div>
  <div class="kpis k4" id="kpis"></div>
  <section class="card">
    <div class="card-b"><div class="aud-filters">
      <div><label class="sr-only" for="fQ">Search</label><input class="input" id="fQ" type="search" placeholder="Search order, user, security, details"></div>
      <div><label class="sr-only" for="fAction">Action</label><select class="input" id="fAction"><option value="">All actions</option></select></div>
      <div><label class="sr-only" for="fTeam">Team</label><select class="input" id="fTeam"></select></div>
      <div><label class="sr-only" for="fRole">Actor role</label><select class="input" id="fRole"><option value="">All roles</option><option value="ADMIN">Event Admin</option><option value="BROKER">Broker</option>
        <option value="EXCHANGE">Exchange</option><option value="BANK">Bank</option><option value="INSTITUTIONAL">Institutional</option><option value="PARTICIPANT">Participant</option><option value="SYSTEM">System</option></select></div>
      <label class="check"><input type="checkbox" id="fRisk"> Risk indicators only</label>
    </div></div>
    <div class="meta-row"><span id="info">Loading…</span><span class="small">Click a row for the before / after record</span></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Timestamp</th><th>Actor</th><th>Role</th><th>Order</th><th>Team</th><th>Security</th><th>Action</th><th>Details</th><th>Risk indicator</th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody></table></div>
    <div class="pager" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-3)"><button class="btn sm" id="prev" type="button">← Newer</button><button class="btn sm" id="next" type="button">Older →</button></div>
  </section>
</main>
<script src="/assets/config.js?v=314"></script>
<script src="/assets/jse.js?v=314"></script>
<script>
(function () {
  "use strict";
  var F = JSE.fmt, esc = JSE.esc, N = JSE.toNum, $ = function (id) { return document.getElementById(id); };
  var S = { page: 1, size: 100, open: {}, data: null };
  var KEYS = ["side", "team_side", "quantity", "price", "market_price", "spread_pct", "expected_price", "trade_value", "brokerage", "brokerage_rate", "amount", "interest", "loan_drawn", "required", "cash", "loan_room",
    "holding", "stage", "mood", "headline", "applied_pct", "lots", "shares", "instruction_no", "slip_no", "reason", "code", "from", "to", "seed", "rows", "changed", "sheets", "counterparty", "institution"];
  function val(k, v) {
    if (typeof v === "object") return JSON.stringify(v);
    if (/rate$/.test(k) && N(v) < 1) return JSE.rate(v);
    if (/^(trade_value|brokerage|amount|interest|loan_drawn|required|cash|loan_room|price|market_price|expected_price)$/.test(k)) return F.money(v);
    return String(v);
  }
  function details(r) {
    var d = r.details || {}, a = r.after || {}, parts = [];
    KEYS.forEach(function (k) {
      var v = d[k] !== undefined && d[k] !== null && d[k] !== "" ? d[k] : a[k];
      if (v !== undefined && v !== null && v !== "" && k !== "status") parts.push(k.replace(/_/g, " ") + ": " + val(k, v));
    });
    return parts.slice(0, 7).join(" · ");
  }
  function cls(a) { return /REJECT|SHORT|SHORTFALL|INSUFFICIENT|FAILED|STALE/.test(a) ? "bad" : /SETTLED|APPROVED|EXECUTED|CREATED|SUBMITTED|START|LISTED/.test(a) ? "good" : ""; }
  function render() {
    var d = S.data; if (!d) return;
    var sel = $("fAction"), v = sel.value;
    if (sel.options.length <= 1 && d.actions.length) { sel.innerHTML = '<option value="">All actions</option>' + d.actions.slice().sort().map(function (a) { return "<option>" + esc(a) + "</option>"; }).join(""); sel.value = v; }
    $("kpis").innerHTML = '<div class="kpi"><div class="k">Entries</div><div class="v">' + F.num(d.total) + '</div><div class="s">matching the filters</div></div>' +
      '<div class="kpi bad"><div class="k">Risk indicators</div><div class="v">' + F.num(d.risk_count || 0) + '</div><div class="s">short selling · insufficient balance</div></div>' +
      '<div class="kpi"><div class="k">Actions recorded</div><div class="v">' + F.num(d.actions.length) + '</div><div class="s">distinct action types</div></div>' +
      '<div class="kpi"><div class="k">Record</div><div class="v sm">Immutable</div><div class="s">append-only · before / after kept</div></div>';
    $("rows").innerHTML = d.rows.length ? d.rows.map(function (r) {
      var main = '<tr class="row-main' + (r.risk ? " risky" : "") + '" data-id="' + r.id + '"><td class="nowrap">' + F.datetime(r.created_at) + '</td><td class="nowrap"><b>' + esc(r.actor || "system") + "</b></td>" +
        '<td class="small nowrap">' + esc(JSE.ROLE_LABEL[r.role] || F.statusText(r.role || "")) + '</td><td class="nowrap">' +
        (r.order_no ? '<a class="mono" href="/orders.html?order=' + encodeURIComponent(r.order_no) + '">' + esc(r.order_no) + "</a>" : '<span class="muted">' + esc(r.entity && r.entity !== "order" ? r.entity + (r.entity_id ? " " + r.entity_id : "") : "") + "</span>") + "</td>" +
        '<td class="nowrap">' + esc(r.team || "") + '</td><td class="nowrap"><b>' + esc(r.security || "") + "</b></td>" +
        '<td class="nowrap"><span class="act ' + cls(r.action) + '">' + esc(r.action) + "</span></td><td class=\"small\">" + esc(details(r)) + "</td>" +
        "<td>" + (r.risk ? '<span class="badge risk' + (/LOAN USED/.test(r.risk) ? " loan" : "") + '">' + esc(r.risk) + "</span>" : '<span class="muted small">—</span>') + "</td></tr>";
      var exp = S.open[r.id] ? '<tr class="expand"><td colspan="9"><div class="grid cols-3" style="padding:14px 18px"><div><div class="label" style="margin-bottom:6px">Before</div><pre class="js">' + esc(JSON.stringify(r.before, null, 1) || "—") +
        '</pre></div><div><div class="label" style="margin-bottom:6px">After</div><pre class="js">' + esc(JSON.stringify(r.after, null, 1) || "—") + '</pre></div><div><div class="label" style="margin-bottom:6px">Details · IP ' + esc(r.ip || "—") + (r.email ? " · " + esc(r.email) : "") +
        '</div><pre class="js">' + esc(JSON.stringify(r.details, null, 1) || "—") + "</pre></div></div></td></tr>" : "";
      return main + exp;
    }).join("") : '<tr><td colspan="9" class="empty">No audit entries match.</td></tr>';
    var from = (S.page - 1) * S.size + 1, to = from + d.rows.length - 1;
    $("info").innerHTML = d.rows.length ? "<b>" + from + "–" + to + "</b> of " + F.num(d.total) + " entries · newest first" : "No entries";
    $("prev").disabled = S.page <= 1; $("next").disabled = to >= d.total;
  }
  async function load() {
    S.data = await JSE.api.get("/api/audit", { action: $("fAction").value, team: $("fTeam").value, role: $("fRole").value, group: S.tab || "", risk: $("fRisk").checked ? "true" : "", q: $("fQ").value.trim(), page: S.page, page_size: S.size });
    render(); $("conn").className = "conn"; $("connText").textContent = "Live · " + F.time(new Date());
  }
  document.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () {
    S.tab = b.getAttribute("data-tab"); S.page = 1; document.querySelectorAll("[data-tab]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); poller.now(); }); });
  $("rows").addEventListener("click", function (e) { if (e.target.closest("a")) return; var tr = e.target.closest("tr.row-main"); if (!tr) return; var id = tr.getAttribute("data-id"); S.open[id] = !S.open[id]; render(); });
  ["fAction", "fTeam", "fRole", "fRisk"].forEach(function (id) { $(id).addEventListener("change", function () { S.page = 1; poller.now(); }); });
  $("fQ").addEventListener("input", JSE.debounce(function () { S.page = 1; poller.now(); }, 350));
  $("prev").onclick = function () { if (S.page > 1) { S.page--; poller.now(); } };
  $("next").onclick = function () { S.page++; poller.now(); };
  $("fTeam").innerHTML = '<option value="">All teams</option>' + JSE.teamCodes().map(function (c) { return "<option>" + c + "</option>"; }).join("");
  var poller;
  JSE.page({ id: "audit" }).then(function (u) {
    if (!u) return;
    var p = new URLSearchParams(location.search);
    if (p.get("team")) $("fTeam").value = p.get("team").toUpperCase();
    if (p.get("q")) $("fQ").value = p.get("q");
    if (p.get("risk")) $("fRisk").checked = true;
    poller = JSE.poll(load, 8000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=272.1">
<style>
  .filters { display: grid; grid-template-columns: 260px 180px minmax(0, 1fr); gap: 10px; }
  @media (max-width: 760px) { .filters { grid-template-columns: 1fr; } }
  pre.js { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); max-height: 140px; overflow: auto; }
  tr.row-main { cursor: pointer; }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><div class="eyebrow">Append-only</div><h1>Audit Log</h1><p>Every order, Exchange and Bank decision, settlement, risk event, loan, Market News move and event-control action, with user, role, time and before/after state.</p></div>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
  </div>
  <div class="card" style="margin-bottom:14px"><div class="card-b"><div class="filters">
    <div class="field"><label for="fAction">Action</label><select class="input" id="fAction"><option value="">All actions</option></select></div>
    <div class="field"><label for="fTeam">Team</label><select class="input" id="fTeam"></select></div>
    <div class="field"><label for="fQ">Search</label><input class="input" id="fQ" type="search" placeholder="Order number, user, symbol, details"></div>
  </div></div></div>
  <div class="card"><div class="card-b flush"><div class="table-wrap"><table class="t">
    <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Team</th><th>Order</th><th>Details</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div>
    <div class="row between" style="padding:10px 14px"><span class="small muted" id="info"></span><div class="row"><button class="btn sm" id="prev">← Newer</button><button class="btn sm" id="next">Older →</button></div></div></div></div>
</main>
<script src="/assets/config.js?v=272.1"></script>
<script src="/assets/jse.js?v=272.1"></script>
<script>
(function () {
  var F = JSE.fmt, esc = JSE.esc, $ = function (id) { return document.getElementById(id); };
  var S = { page: 1, size: 100, open: {}, data: null, force: true };
  function summary(r) {
    var d = r.details || {}, parts = [];
    ["side", "symbol", "quantity", "price", "trade_value", "brokerage", "amount", "interest", "mood", "applied_pct", "code", "reason", "required", "cash", "holding", "loan_drawn", "status"].forEach(function (k) {
      if (d[k] !== undefined && d[k] !== null && d[k] !== "") parts.push(k.replace(/_/g, " ") + ": " + (typeof d[k] === "object" ? JSON.stringify(d[k]) : d[k]));
    });
    if (r.after && r.after.status) parts.push("→ " + r.after.status);
    return parts.slice(0, 6).join(" · ");
  }
  function render() {
    var d = S.data; if (!d) return;
    var sel = $("fAction"), v = sel.value;
    if (sel.options.length <= 1 && d.actions.length) { sel.innerHTML = '<option value="">All actions</option>' + d.actions.sort().map(function (a) { return "<option>" + esc(a) + "</option>"; }).join(""); sel.value = v; }
    $("rows").innerHTML = d.rows.length ? d.rows.map(function (r) {
      var main = '<tr class="row-main" data-id="' + r.id + '"><td class="nowrap">' + F.datetime(r.created_at) + "</td><td><b>" + esc(r.actor || "") + "</b>" + (r.email ? '<div class="tiny muted">' + esc(r.email) + "</div>" : "") + "</td><td>" + esc(r.role || "") +
        '</td><td><span class="badge ' + (/REJECT|SHORT|SHORTFALL|INSUFFICIENT|FAILED/.test(r.action) ? "no" : /SETTLED|APPROVED|LOGIN$|START/.test(r.action) ? "ok" : "prov") + '">' + esc(r.action) + "</span></td><td>" + esc((r.entity || "") + (r.entity_id ? " " + r.entity_id : "")) +
        "</td><td>" + esc(r.team || "") + '</td><td class="mono">' + esc(r.order_no || "") + '</td><td class="small">' + esc(summary(r)) + "</td></tr>";
      var exp = S.open[r.id] ? '<tr class="expand"><td colspan="8"><div class="grid cols-3" style="padding:12px 14px"><div><div class="label">Before</div><pre class="js">' + esc(JSON.stringify(r.before, null, 1) || "—") +
        '</pre></div><div><div class="label">After</div><pre class="js">' + esc(JSON.stringify(r.after, null, 1) || "—") + '</pre></div><div><div class="label">Details · IP ' + esc(r.ip || "—") + '</div><pre class="js">' + esc(JSON.stringify(r.details, null, 1) || "—") + "</pre></div></div></td></tr>" : "";
      return main + exp;
    }).join("") : '<tr><td colspan="8" class="empty">No audit entries match.</td></tr>';
    var from = (S.page - 1) * S.size + 1, to = from + d.rows.length - 1;
    $("info").textContent = d.rows.length ? from + "–" + to + " of " + F.num(d.total) : "";
    $("prev").disabled = S.page <= 1; $("next").disabled = to >= d.total;
  }
  async function load() {
    S.data = await JSE.api.get("/api/audit", { action: $("fAction").value, team: $("fTeam").value, q: $("fQ").value.trim(), page: S.page, page_size: S.size });
    render(); $("conn").className = "conn"; $("connText").textContent = "Live · updated " + F.time(new Date());
  }
  $("rows").addEventListener("click", function (e) { var tr = e.target.closest("tr.row-main"); if (!tr) return; var id = tr.getAttribute("data-id"); S.open[id] = !S.open[id]; render(); });
  ["fAction", "fTeam"].forEach(function (id) { $(id).addEventListener("change", function () { S.page = 1; poller.now(); }); });
  $("fQ").addEventListener("input", JSE.debounce(function () { S.page = 1; poller.now(); }, 350));
  $("prev").onclick = function () { if (S.page > 1) { S.page--; poller.now(); } };
  $("next").onclick = function () { S.page++; poller.now(); };
  $("fTeam").innerHTML = '<option value="">All teams</option>' + JSE.teamCodes().map(function (c) { return "<option>" + c + "</option>"; }).join("");
  var poller;
  JSE.page({ id: "audit" }).then(function (u) { if (u) poller = JSE.poll(load, 8000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } }); });
})();
</script>
</body>
</html>

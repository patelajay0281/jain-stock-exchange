<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Certificates</title><link rel="stylesheet" href="/theme.css"><style>
@media print{
  body>*{display:none!important}
  #certificatePrint{display:block!important}
}
#certificatePrint{display:none}
.certificate-sheet{max-width:900px;margin:40px auto;padding:48px;border:2px solid #172033;background:#fff;color:#000;font-family:Georgia,serif}
.certificate-sheet h1{margin:0;text-align:center;font-size:28px;letter-spacing:.08em}
.certificate-sheet .sub{text-align:center;margin:8px 0 28px;font-size:12px;letter-spacing:.12em}
.certificate-sheet .line{display:flex;justify-content:space-between;gap:24px;padding:10px 0;border-bottom:1px solid #d6dde7;font-family:Inter,Arial,sans-serif;font-size:14px}
.certificate-sheet .footer{margin-top:32px;text-align:center;font-size:11px}
</style><style>
/* Rule: white/light surfaces use black text */
body{color:#000!important}
.site-nav a,h1,p,.table-wrap,table,th,td,button{color:#000}
.site-nav a{background:#fff!important;color:#000!important}
.table-wrap,table{background:#fff!important}
th{background:#f3f6fa!important;color:#000!important}
td{background:#fff!important;color:#000!important}
</style></head><body><div class="shell page"><header class="brand">JAIN STOCK EXCHANGE</header><nav class="site-nav"><a href="/">Market</a><a href="/order.html">Create Order</a><a href="/exchange.html">Exchange Settlement</a><a href="/bank.html">Bank Settlement</a><a href="/orders.html">Order Tracking</a><a href="/certificates.html">Share Certificates</a><a href="/commissions.html">Broker Commission</a><a href="/portfolios.html">Participant Portfolios</a><a class="admin-only-link" href="/admin.html">Event Admin</a><a href="/audit.html">Audit Log</a><a href="/cash.html">Cash Ledger</a></nav><h1>Share Certificates</h1><p>Settled share transactions only.</p><div id="app"></div></div><script>const A="/api",money=n=>"₹"+Math.round(Number(n||0)).toLocaleString("en-IN");function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function printCertificate(x){
  const holder=esc(x.team||"—"),stock=esc(x.stock||"—"),order=esc(x.order_code||"—"),side=esc(x.side||"—"),qty=Number(x.quantity||0).toLocaleString("en-IN"),price=money(x.price),value=money(x.trade_value),date=esc(new Date(x.created_at).toLocaleString("en-IN"));
  document.querySelector("#certificatePrint").innerHTML='<div class="certificate-sheet"><h1>JAIN STOCK EXCHANGE</h1><div class="sub">SHARE SETTLEMENT CERTIFICATE</div><div class="line"><b>Certificate / Order</b><span>'+order+'</span></div><div class="line"><b>Customer Team</b><span>'+holder+'</span></div><div class="line"><b>Security</b><span>'+stock+'</span></div><div class="line"><b>Transaction</b><span>'+side+' · '+qty+' shares @ '+price+'</span></div><div class="line"><b>Trade Value</b><span>'+value+'</span></div><div class="line"><b>Brokerage</b><span>'+money(x.brokerage)+'</span></div><div class="line"><b>Settlement</b><span>COMPLETED</span></div><div class="line"><b>Settled At</b><span>'+date+'</span></div><div class="footer">System-generated settlement certificate · JAIN STOCK EXCHANGE</div></div>';
  window.print();
}
async function loadCertificates(){try{const h=new Headers({"Accept":"application/json"}),t=localStorage.getItem("jse_token");if(t)h.set("Authorization","Bearer "+t);const r=await fetch(A+"/certificates",{headers:h,cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Certificates unavailable");const rows=d.certificates||[];document.querySelector('#app').innerHTML=rows.length?'<div class="table-wrap"><table><tr><th>Certificate / Order</th><th>Team</th><th>Broker</th><th>Stock</th><th>Transaction</th><th>Trade Value</th><th>Brokerage</th><th>Settlement</th><th>Date</th><th>Action</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.order_code)+'</td><td>'+esc(x.team)+'</td><td>'+esc(x.broker)+'</td><td>'+esc(x.stock)+'</td><td>'+esc(x.side)+' '+Number(x.quantity||0).toLocaleString("en-IN")+' shares @ '+money(x.price)+'</td><td>'+money(x.trade_value)+'</td><td>'+money(x.brokerage)+'</td><td>COMPLETED</td><td>'+esc(x.created_at)+'</td><td><button type="button" class="print-cert" data-order="'+esc(x.order_code)+'">PRINT</button></td></tr>').join('')+'</table></div>':'<p>No settled transactions yet.</p>';
  document.querySelectorAll(".print-cert").forEach(btn=>btn.addEventListener("click",()=>{const x=rows.find(v=>v.order_code===btn.dataset.order);if(x)printCertificate(x)}));
}catch(e){document.querySelector("#app").textContent=e.message||"Certificates unavailable";}}
document.body.insertAdjacentHTML("beforeend",'<div id="certificatePrint"></div>');
loadCertificates();</script><script src="/admin-nav.js"></script></body></html>

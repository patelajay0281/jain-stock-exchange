<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=272.1">
<style>
  .cert { width: 100%; max-width: 1050px; aspect-ratio: 297 / 210; margin: 0 auto 24px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; padding: 4.5% 6%; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cert::before { content: ""; position: absolute; inset: 14px; border: 3px double #172b4d; pointer-events: none; }
  .cert .logo { max-width: 46%; margin-bottom: 2.5%; }
  .cert .kind { font-size: clamp(14px, 2.2vw, 22px); letter-spacing: 6px; font-weight: 900; color: #8a6d1d; text-transform: uppercase; }
  .cert h2 { font-size: clamp(26px, 4.4vw, 46px); margin: 1.5% 0 1%; color: var(--navy); letter-spacing: 2px; }
  .cert .lead { font-size: clamp(12px, 1.6vw, 16px); color: var(--ink-2); }
  .cert .who { font-size: clamp(22px, 3.6vw, 38px); font-weight: 900; color: var(--ink); margin: 2% 0 .5%; border-bottom: 2px solid var(--line-2); padding: 0 4% 1%; }
  .cert .members { font-size: clamp(12px, 1.5vw, 15px); color: var(--muted); }
  .cert .stats { display: flex; gap: 6%; justify-content: center; margin-top: 3%; font-size: clamp(11px, 1.4vw, 14px); }
  .cert .stats b { display: block; font-size: clamp(14px, 2vw, 20px); color: var(--navy); }
  .cert .sign { position: absolute; bottom: 7%; left: 8%; right: 8%; display: flex; justify-content: space-between; font-size: clamp(10px, 1.2vw, 13px); color: var(--ink-2); }
  .cert .sign span { border-top: 1px solid var(--ink-2); padding-top: 4px; min-width: 24%; }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    .cert { box-shadow: none; border: 0; width: 297mm; height: 210mm; max-width: none; margin: 0; page-break-after: always; aspect-ratio: auto; }
    .wrap > *:not(#certs) { display: none !important; }
    .wrap { padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head no-print">
    <div><div class="eyebrow">Final results</div><h1>Certificates</h1><p>Winners are ranked by Net Worth among teams that satisfy the ₹50K closing cash rule (final after the market closes).</p></div>
    <div class="row"><select class="input" id="which" style="max-width:300px">
      <option value="top3">Winner, 1st and 2nd runner-up</option><option value="all">Participation — all teams</option><option value="team">Single team…</option></select>
      <select class="input hidden" id="team" style="max-width:160px"></select>
      <button class="btn primary" id="print" type="button">Print / Save as PDF</button></div>
  </div>
  <div class="alert warn no-print hidden" id="prov" style="margin-bottom:14px"></div>
  <div class="card no-print" style="margin-bottom:18px"><div class="card-h"><h2>Final ranking</h2></div><div class="card-b flush"><div class="table-wrap" style="max-height:360px"><table class="t">
    <thead><tr><th class="num">Pool rank</th><th>Team</th><th>Name</th><th class="num">Net Worth</th><th class="num">P/L</th><th class="num">Return</th><th>₹50K Rule</th></tr></thead><tbody id="rank"></tbody></table></div></div></div>
  <div id="certs"></div>
</main>
<script src="/assets/config.js?v=272.1"></script>
<script src="/assets/jse.js?v=272.1"></script>
<script>
(function () {
  var F = JSE.fmt, esc = JSE.esc, $ = function (id) { return document.getElementById(id); };
  var S = { d: null };
  var TITLES = ["Winner", "1st Runner-up", "2nd Runner-up"];
  function cert(t, kind) {
    return '<section class="cert"><img class="logo" src="/assets/img/jain-cms-logo.png" alt="JAIN (Deemed-to-be University) · CMS Business School">' +
      '<div class="kind">' + esc(kind) + '</div><h2>Certificate of ' + (kind === "Participation" ? "Participation" : "Achievement") + "</h2>" +
      '<div class="lead">This certificate is presented to</div><div class="who">' + esc(t.name && t.name !== "Team " + t.team.slice(5) ? t.name + " (" + t.team + ")" : t.team) + "</div>" +
      (t.members ? '<div class="members">' + esc(t.members) + "</div>" : "") +
      '<div class="lead" style="margin-top:2%">for ' + (kind === "Participation" ? "participating in" : "the " + esc(kind.toLowerCase()) + " position at") + " <b>" + esc(S.d.event_name || "DALAL STREET 2026") + "</b>, the JAIN STOCK EXCHANGE trading simulation.</div>" +
      '<div class="stats"><div><b>' + F.money(t.net_worth) + "</b>Net Worth</div><div><b>" + F.pct(t.return_pct) + "</b>Return</div>" + (t.rank_in_pool ? "<div><b>#" + t.rank_in_pool + "</b>Rank</div>" : "") + "</div>" +
      '<div class="sign"><span>Faculty Coordinator</span><span>Chief Stock Exchange Controller</span><span>Director, CMS Business School</span></div></section>';
  }
  function render() {
    var d = S.d; if (!d) return;
    $("prov").classList.toggle("hidden", d.status === "CLOSED" || d.status === "FINALIZED");
    $("prov").innerHTML = "<b>Provisional:</b> the market is " + esc(F.statusText(d.status)) + ". Rankings become final when the event is CLOSED / FINALIZED.";
    $("rank").innerHTML = d.ranking.map(function (r) { return "<tr" + (r.winner ? ' class="winner"' : "") + '><td class="num">' + (r.rank_in_pool || "—") + "</td><td><b>" + esc(r.team) + "</b></td><td>" + esc(r.name || "") + '</td><td class="num">' + F.money(r.net_worth) + '</td><td class="num ' + F.dir(r.pnl) + '">' + F.signedMoney(r.pnl) + '</td><td class="num">' + F.pct(r.return_pct) + "</td><td>" + (r.cash_rule_met ? '<span class="badge ok">Satisfied</span>' : '<span class="badge no">Not satisfied</span>') + "</td></tr>"; }).join("");
    var which = $("which").value, html = "";
    if (which === "top3") html = d.ranking.filter(function (r) { return r.rank_in_pool && r.rank_in_pool <= 3; }).map(function (r) { return cert(r, TITLES[r.rank_in_pool - 1]); }).join("") || '<div class="alert info">No eligible teams yet.</div>';
    else if (which === "all") html = d.ranking.slice().sort(function (a, b) { return JSE.teamSort(a.team, b.team); }).map(function (r) { return cert(r, "Participation"); }).join("");
    else { var t = d.ranking.filter(function (r) { return r.team === $("team").value; })[0]; html = t ? cert(t, t.rank_in_pool && t.rank_in_pool <= 3 ? TITLES[t.rank_in_pool - 1] : "Participation") : ""; }
    $("certs").innerHTML = html;
  }
  $("which").onchange = function () { $("team").classList.toggle("hidden", $("which").value !== "team"); render(); };
  $("team").onchange = render;
  $("print").onclick = function () { window.print(); };
  JSE.page({ id: "certificates" }).then(async function (u) {
    if (!u) return;
    try { S.d = await JSE.api.get("/api/certificates"); $("team").innerHTML = S.d.ranking.slice().sort(function (a, b) { return JSE.teamSort(a.team, b.team); }).map(function (r) { return "<option>" + esc(r.team) + "</option>"; }).join(""); render(); }
    catch (e) { JSE.toast(e.message, "bad"); }
  });
})();
</script>
</body>
</html>

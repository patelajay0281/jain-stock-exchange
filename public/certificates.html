<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Certificates</title><link rel="stylesheet" href="/theme.css"></head><body><div class="shell page"><header class="brand">JAIN STOCK EXCHANGE</header><nav class="site-nav"><a href="/">Market</a><a href="/order.html">Create Order</a><a href="/exchange.html">Exchange Settlement</a><a href="/bank.html">Bank Settlement</a><a href="/orders.html">Order Tracking</a><a href="/certificates.html">Share Certificates</a><a href="/commissions.html">Broker Commission</a><a href="/portfolios.html">Participant Portfolios</a><a class="admin-only-link" href="/admin.html">Event Admin</a><a href="/audit.html">Audit Log</a><a href="/cash.html">Cash Ledger</a></nav><h1>Share Certificates</h1><p>Settled share transactions only.</p><div id="app"></div></div><script>const A=window.__HATCHABLE__.api,money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});fetch(A+'/certificates').then(async r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{const rows=d.certificates||[];document.querySelector('#app').innerHTML=rows.length?'<div class="table-wrap"><table><tr><th>Certificate / Order</th><th>Team</th><th>Broker</th><th>Stock</th><th>Transaction</th><th>Trade Value</th><th>Brokerage</th><th>Settlement</th><th>Date</th><th>Action</th></tr>'+rows.map(x=>'<tr><td>'+x.order_code+'</td><td>'+x.team+'</td><td>'+x.broker+'</td><td>'+x.stock+'</td><td>'+x.side+' '+x.quantity+' shares @ '+money(x.price)+'</td><td>'+money(x.trade_value)+'</td><td>'+money(x.brokerage)+'</td><td>COMPLETED</td><td>'+x.created_at+'</td><td><button onclick="print()">PRINT</button></td></tr>').join('')+'</table></div>':'<p>No settled transactions yet.</p>'}).catch(()=>document.querySelector('#app').textContent='Admin access required.')</script><script src="/admin-nav.js"></script></body></html>

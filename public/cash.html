<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Ledger · JAIN STOCK EXCHANGE</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/jse.css?v=313">
<style>
  .cash-filters { display: grid; grid-template-columns: 240px 260px 160px auto; justify-content: start; gap: 12px; align-items: center; }
  @media (max-width: 900px) { .cash-filters { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .cash-filters { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main id="main" class="wrap wide">
  <div class="page-head">
    <div><h1>Cash Ledger</h1><p>Complete cash movement audit trail. Current cash is shown separately from ledger movement.</p></div>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">Loading…</span></span>
  </div>
  <div id="recon" style="margin-bottom:16px"></div>
  <div class="kpis k5" id="kpis"></div>
  <section class="card">
    <div class="card-b"><div class="cash-filters">
      <div><label class="sr-only" for="fTeam">Team</label><select class="input" id="fTeam"></select></div>
      <div><label class="sr-only" for="fType">Transaction type</label><select class="input" id="fType"><option value="">All entry types</option><option value="INITIAL_CAPITAL">Initial capital</option><option value="IPO_ALLOTMENT">IPO allotment</option><option value="BUY">Buy</option><option value="SELL">Sell</option><option value="BROKERAGE">Brokerage</option><option value="LOAN_DRAW">Loan withdrawal</option><option value="INTEREST_CHARGE">Interest charged</option><option value="INTEREST">Interest paid</option><option value="LOAN_REPAYMENT">Loan repayment</option><option value="REVERSAL">Reversal</option><option value="ADJUSTMENT">Adjustment</option></select></div>
      <div><label class="sr-only" for="fRows">Rows</label><select class="input" id="fRows"><option value="50">50 rows</option><option value="100">100 rows</option><option value="25">25 rows</option></select></div>
      <input type="hidden" id="fQ" value="">
      <button class="btn primary" type="button" id="refresh">Refresh</button>
    </div></div>
    <div class="meta-row"><span id="info">Loading…</span><span id="byType" class="small"></span></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Timestamp</th><th>Team</th><th>Order</th><th>Transaction type</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance after</th><th>Note</th><th>Actor</th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody></table></div>
    <div class="pager" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-3)"><button class="btn sm" id="prev">← Newer</button><button class="btn sm" id="next">Older →</button></div>
  </section>
</main>
<script src="/assets/config.js?v=313"></script>
<script src="/assets/jse.js?v=313"></script>
<script>
(function () {
  var F = JSE.fmt, esc = JSE.esc, N = JSE.toNum, $ = function (id) { return document.getElementById(id); };
  var S = { page: 1, size: 50 };
  var TYPE = { LOAN_DRAW: "Loan withdrawal", INTEREST: "Interest paid", INTEREST_CHARGE: "Interest charged", INITIAL_CAPITAL: "Initial capital", IPO_ALLOTMENT: "IPO allotment", LOAN_REPAYMENT: "Loan repayment",
    BUY: "Buy", SELL: "Sell", BROKERAGE: "Brokerage", REVERSAL: "Reversal", ADJUSTMENT: "Adjustment" };
  function kpi(k, v, s, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || "&nbsp;") + "</div></div>"; }
  async function load() {
    var d = await JSE.api.get("/api/cash", { team: $("fTeam").value, type: $("fType").value, q: $("fQ").value.trim(), page: S.page, page_size: S.size });
    var r = d.reconciliation, sm = d.summary, bt = sm.by_type || {};
    $("recon").innerHTML = r.ok ? '<div class="alert good"><b>Reconciled.</b> The ledger matches the cash balance of all ' + r.teams_checked + " team(s) checked (credits − debits and the last running balance).</div>"
      : '<div class="alert bad"><b>Mismatch in ' + r.mismatches + " team(s):</b> " + esc((r.mismatched_teams || []).join(", ")) + ". Contact the administrator.</div>";
    var team = $("fTeam").value;
    $("kpis").innerHTML = kpi("Total debit", F.money(sm.debits), "money out", "bad") + kpi("Total credit", F.money(sm.credits), "money in", "good") +
      kpi("Net movement", F.signedMoney(sm.net_movement), "credits − debits" + ($("fType").value ? " (filtered)" : ""), N(sm.net_movement) < 0 ? "bad" : "") +
      kpi("Current cash", F.money(sm.current_cash), team ? team : F.num(sm.teams) + " teams combined") +
      kpi("Entries", F.num(sm.entries), "matching the filters");
    var g = function (k) { return bt[k] || { count: 0, debit: 0, credit: 0 }; };
    $("byType").textContent = "Brokerage " + F.money(g("BROKERAGE").debit) + " · loan withdrawals " + F.money(g("LOAN_DRAW").credit) + " · interest paid " + F.money(g("INTEREST").debit) + " · repayments " + F.money(g("LOAN_REPAYMENT").debit);
    $("rows").innerHTML = d.rows.length ? d.rows.map(function (x) {
      return '<tr><td class="nowrap">' + F.datetime(x.created_at) + "</td><td><b>" + esc(x.team) + '</b><span class="sub">' + esc(x.team_name || "") + "</span></td><td>" + (x.order_no ? '<a class="mono" href="/orders.html?order=' + encodeURIComponent(x.order_no) + '">' + esc(x.order_no) + "</a>" : "") +
        '</td><td><span class="badge ' + (N(x.credit) > 0 ? "ok" : N(x.debit) > 0 ? "prov" : "prov") + '">' + esc(TYPE[x.type] || x.type.replace(/_/g, " ")) +
        '</span></td><td class="num down">' + (N(x.debit) ? F.money(x.debit) : "") + '</td><td class="num up">' + (N(x.credit) ? F.money(x.credit) : "") + '</td><td class="num"><b>' + F.money(x.balance_after) + '</b></td><td class="small">' + esc(x.note || "") + '</td><td class="small">' + esc(x.actor || "") + "</td></tr>";
    }).join("") : '<tr><td colspan="9" class="empty">No ledger entries match.</td></tr>';
    var from = (S.page - 1) * S.size + 1, to = from + d.rows.length - 1;
    $("info").innerHTML = d.rows.length ? "<b>" + from + "–" + to + "</b> of " + F.num(sm.entries) + " entries · newest first" : "No entries";
    $("prev").disabled = S.page <= 1; $("next").disabled = to >= N(sm.entries);
    $("conn").className = "conn"; $("connText").textContent = "Live · " + F.time(new Date());
  }
  ["fTeam", "fType"].forEach(function (id) { $(id).addEventListener("change", function () { S.page = 1; poller.now(); }); });
  $("fRows").addEventListener("change", function () { S.size = Number($("fRows").value); S.page = 1; poller.now(); });
  $("refresh").onclick = function () { poller.now(); };
  $("prev").onclick = function () { if (S.page > 1) { S.page--; poller.now(); } };
  $("next").onclick = function () { S.page++; poller.now(); };
  var poller;
  JSE.page({ id: "cash" }).then(function (u) {
    if (!u) return;
    $("fTeam").innerHTML = u.role === "PARTICIPANT" ? "<option>" + esc(u.team) + "</option>" : '<option value="">All teams</option>' + JSE.teamCodes().map(function (c) { return "<option>" + c + "</option>"; }).join("");
    if (u.role === "PARTICIPANT") $("fTeam").disabled = true;
    var t = new URLSearchParams(location.search).get("team"); if (t && u.role !== "PARTICIPANT") $("fTeam").value = t.toUpperCase();
    poller = JSE.poll(load, 8000, { onError: function (e) { $("conn").className = "conn down"; $("connText").textContent = "Reconnecting… " + e.message; } });
  });
})();
</script>
</body>
</html>

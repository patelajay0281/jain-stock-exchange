name: JSE API build (v272 staging)

on:
  push:
    branches: [v272]
    paths-ignore:
      - "backend/dist/app.mjs"
      - "docs/**"
      - "tests/ci/results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jse-api-build-v272
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build API bundle
        run: npm run build
      - name: Check API bundle syntax and digest
        id: bundle
        run: |
          node --check backend/dist/app.mjs
          echo "sha256=$(sha256sum backend/dist/app.mjs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < backend/dist/app.mjs)" >> "$GITHUB_OUTPUT"
          echo "API bundle SHA-256: $(sha256sum backend/dist/app.mjs | cut -d ' ' -f 1)"
          echo "API bundle bytes: $(wc -c < backend/dist/app.mjs)"
      - name: Commit compiled API bundle if changed
        run: |
          git config user.name "jse-api-build[bot]"
          git config user.email "jse-api-build[bot]@users.noreply.github.com"
          git add backend/dist/app.mjs
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
            exit 0
          fi
          git commit -m "Build API bundle for v272 staging [skip ci]"
          git push origin HEAD:v272

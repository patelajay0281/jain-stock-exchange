name: JSE throughput validation

on:
  workflow_dispatch:

concurrency:
  group: jse-throughput-validation
  cancel-in-progress: true

jobs:
  throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 60

      - name: Verify production health
        env:
          BASE_URL: https://jain-stock-exchange.pages.dev
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE_URL/api/health" | tee /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(!d.ok||!d.db) process.exit(1)"

      - name: Run 1,000 database-backed health requests
        env:
          BASE_URL: https://jain-stock-exchange.pages.dev
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const total=1000;
          const concurrency=25;
          const results=new Array(total);
          let cursor=0;

          async function worker(){
            while(true){
              const i=cursor++;
              if(i>=total)return;
              const started=performance.now();
              try{
                const r=await fetch(base+'/api/health?probe='+i,{cache:'no-store'});
                const body=await r.text();
                results[i]={status:r.status,ms:performance.now()-started,body};
              }catch(e){
                results[i]={status:0,ms:performance.now()-started,error:String(e)};
              }
            }
          }

          const started=performance.now();
          await Promise.all(Array.from({length:concurrency},()=>worker()));
          const elapsed=performance.now()-started;
          const ok=results.filter(x=>x.status===200);
          const failed=results.length-ok.length;
          const sorted=ok.map(x=>x.ms).sort((a,b)=>a-b);
          const pct=p=>sorted.length?sorted[Math.min(sorted.length-1,Math.floor((sorted.length-1)*p))]:0;
          const rps=total/(elapsed/1000);

          const out={
            total_requests:total,
            concurrency,
            successful:ok.length,
            failed,
            elapsed_ms:Number(elapsed.toFixed(2)),
            requests_per_second:Number(rps.toFixed(2)),
            database_operations_per_10_seconds:Number((rps*10).toFixed(2)),
            p50_ms:Number(pct(.50).toFixed(2)),
            p95_ms:Number(pct(.95).toFixed(2)),
            p99_ms:Number(pct(.99).toFixed(2))
          };

          console.log(JSON.stringify(out,null,2));
          if(failed>0 || elapsed>10000){
            console.error('FAIL: 1,000 database-backed requests did not complete within 10 seconds with zero failures.');
            process.exit(1);
          }
          NODE

      - name: Run 1,000 realtime requests
        env:
          BASE_URL: https://jain-stock-exchange.pages.dev
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const total=1000;
          const concurrency=25;
          const results=new Array(total);
          let cursor=0;

          async function worker(){
            while(true){
              const i=cursor++;
              if(i>=total)return;
              const started=performance.now();
              try{
                const r=await fetch(base+'/api/realtime?probe='+i,{cache:'no-store'});
                await r.text();
                results[i]={status:r.status,ms:performance.now()-started};
              }catch(e){
                results[i]={status:0,ms:performance.now()-started,error:String(e)};
              }
            }
          }

          const started=performance.now();
          await Promise.all(Array.from({length:concurrency},()=>worker()));
          const elapsed=performance.now()-started;
          const ok=results.filter(x=>x.status===200);
          const failed=results.length-ok.length;
          const sorted=ok.map(x=>x.ms).sort((a,b)=>a-b);
          const pct=p=>sorted.length?sorted[Math.min(sorted.length-1,Math.floor((sorted.length-1)*p))]:0;
          const rps=total/(elapsed/1000);

          const out={
            total_requests:total,
            concurrency,
            successful:ok.length,
            failed,
            elapsed_ms:Number(elapsed.toFixed(2)),
            requests_per_second:Number(rps.toFixed(2)),
            database_operations_per_10_seconds:Number((rps*10).toFixed(2)),
            p50_ms:Number(pct(.50).toFixed(2)),
            p95_ms:Number(pct(.95).toFixed(2)),
            p99_ms:Number(pct(.99).toFixed(2))
          };

          console.log(JSON.stringify(out,null,2));
          if(failed>0 || elapsed>10000){
            console.error('FAIL: 1,000 realtime requests did not complete within 10 seconds with zero failures.');
            process.exit(1);
          }
          NODE
